function prepareImport(text){
  const rows = parseCSV(text.replace(/^\uFEFF/,''));
  if(rows.length<2) return toast('That file has no data rows.','err');
  const head = rows[0].map(h=>h.trim().toLowerCase());
  const idx = name => head.indexOf(name.toLowerCase());
  if(idx('Company Name')<0) return toast('Missing the "Company Name" column.','err');
  const seen = [];
  const out = rows.slice(1).map((r,i)=>{ const g = c => (idx(c)>=0 ? (r[idx(c)]||'') : '').trim();
    const d = {company:g('Company Name'),website:g('Website'),industry:g('Industry'),location:g('Location'),contact:g('Contact Name'),title:g('Job Title'),phone:g('Phone'),whatsapp:g('WhatsApp'),email:g('Email'),linkedin:g('LinkedIn'),source:g('Lead Source'),notes:g('Notes')};
    let state='ok', msg='';
    if(!d.company){ state='error'; msg='Missing company name'; }
    else if(d.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)){ state='error'; msg='Invalid email'; }
    else { const probe = {company:d.company,website:d.website,contacts:[{email:d.email,phone:d.phone,whatsapp:d.whatsapp}]};
      const dups = findDuplicates(probe); const inFile = seen.find(x=>normCo(x)===normCo(d.company));
      if(dups.length){ state='duplicate'; msg = 'Matches '+dups[0].l.company; } else if(inFile){ state='duplicate'; msg='Repeated in this file'; } }
    seen.push(d.company);
    return {n:i+2, d, state, msg}; });
  S.importState = {rows:out, partnerId: isAdmin() ? '' : myPid(), month:thisMonth(), includeDups:false};
  render();
}

    return { id:'L'+Date.now().toString(36).toUpperCase()+i, company:d.company, website:d.website, industry:ind, location:d.location, size:'', socials:{linkedin:'',instagram:'',facebook:'',other:''},
      contacts:[{id:uid('c'),name:d.contact,title:d.title,email:d.email,phone:d.phone,whatsapp:d.whatsapp,linkedin:d.linkedin}],
      addedAt:today(), month:st.month||thisMonth(), source: sources.find(s=>s.toLowerCase()===d.source.toLowerCase()) || (d.source?'Other':''), createdBy:'import',
      partnerId: st.partnerId||null, backupPartnerId:null, priority:'warm', score:50, services:[], value:'', probability:10, expectedClose:'', status:'new',
      next:{type:'Research',text:'Research and make first contact',due:addDays(today(),2),reminder:'Morning of'}, lastContacted:'',
      activities:[{id:uid('a'),at:now,by:actor(),type:'Note',text:`Imported from CSV${d.industry&&!INDUSTRIES.includes(ind)?' (industry: '+d.industry+')':''}.`}],
      notes: d.notes ? [{id:uid('n'),at:now,by:actor(),kind:'internal',text:d.notes}] : [], stageHistory:[{s:'new',at:now}], updatedAt:now }; });
  toast(`Importing ${list.length} lead${list.length===1?'':'s'}…`);
  const res = await bulkWrite(list);
  st.result = { imported:res.ok, skipped: st.rows.length - take.length, duplicates: st.rows.filter(r=>r.state==='duplicate').length, errors: st.rows.filter(r=>r.state==='error').length + res.failed };
  S.importState = {result:st.result}; render();
  toast(`${res.ok} lead${res.ok===1?'':'s'} imported.`);
}

async function downloadCSV(filename, L){
  const head = ['Company Name','Website','Industry','Location','Company Size','Contact Name','Job Title','Email','Phone','WhatsApp','LinkedIn','Lead Source','Assigned To','Account Manager','Status','Priority','Lead Score','Potential Services','Est. Monthly Value (GBP)','Probability (%)','Next Action Type','Next Action','Due Date','Last Contacted','Date Added','Month','Rejection Reason','Re-contact Date','Latest Note'];
  const rows = L.map(l=>{ const c = contact(l); const note = [...(l.notes||[])].sort((a,b)=>b.at.localeCompare(a.at))[0]?.text||'';
    return [l.company,l.website,l.industry,l.location,l.size,c.name,c.title,c.email,c.phone,c.whatsapp,c.linkedin,l.source,pname(l.partnerId),l.accountManagerId?pname(l.accountManagerId):'',ST[l.status]?.l,l.priority,l.score,(l.services||[]).join('; '),l.value,l.probability,l.next?.type,l.next?.text,l.next?.due,l.lastContacted,l.addedAt,l.month,l.rejection?.reason,l.notNow?.recontact,note]; });
  const csv = '\uFEFF' + [head,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');
  const dl = S.cap.downloads;
  if(dl){ try{ await dl.save({filename, data:csv}); toast(`Exported ${L.length} leads.`); } catch(e){ if(e?.code!=='declined') toast("Couldn't export the file. Try again.",'err'); } return; }
  try{ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); toast(`Exported ${L.length} leads.`); }
  catch(e){ toast('Downloads are not available in this view.','err'); }
}

const RPS_CONTEXT = 'You work for Rock Paper Scissors, a Croydon (UK) studio that grows brands on social media (management, strategy, content, paid social, websites, brand identity) and builds AI systems (custom AI software, automation, AI agents, chatbots, document processing, CRM integrations, AI consulting). Use UK English. Be concise, specific to the lead data given, never generic.';

function refreshAI(id){ const l = S.leads[id]; const box = document.getElementById('ai-'+id); if(box && l){ const tmp = document.createElement('div'); tmp.innerHTML = aiCard(l); box.replaceWith(tmp.firstElementChild); } }
async function runAI(kind, id){
  const sample = S.cap.sample, l = S.leads[id]; if(!sample || !l) return;
  const brief = leadBrief(l);
  const ch = kind==='draft' ? ($('#ai-ch-'+id)?.value||'email') : '';
  S.ai[id] = {kind: kind==='draft' ? 'draft-'+ch : kind, loading:true, text:''}; refreshAI(id);
  try{
    if(kind==='next'){
      const data = await sample.json(`${RPS_CONTEXT}\n\nLead data:\n${brief}\n\nRecommend the single best next action to move this lead forward. Return only JSON: {"type": one of ${JSON.stringify(NEXT_TYPES)}, "text": short imperative action under 12 words, "dueInDays": integer 0-30, "reason": one or two sentences grounded in the activity history}.`, {modelTier:'quick'});
      S.ai[id] = {kind, data};
    } else if(kind==='score'){
      const data = await sample.json(`${RPS_CONTEXT}\n\nLead data:\n${brief}\n\nScore this prospect 0-100 on company fit, industry, marketing need, social presence, potential budget, decision maker identified, engagement, timing and service fit. Return only JSON: {"score": integer, "priority": "hot"|"warm"|"cold", "reasons": [3-5 short strings]}.`, {modelTier:'quick'});
      S.ai[id] = {kind, data};
    } else {
      const prompts = {
        summary:'Write a 2-4 sentence internal summary of this lead: fit, what they need, where things stand and what is blocking progress. No headings.',
        research:'Based on the company details and your general knowledge (flag anything you are unsure of and do not invent facts about real people), give: a one-line company overview, likely decision-maker roles to target, 3 marketing or AI opportunities, which RPS services fit best, and a suggested outreach angle. Plain text with short labelled lines.',
        'draft-email':'Draft a short personalised email (subject line + under 120 words) from the assigned RPS partner to the primary contact. Reference specifics from the notes and activity. No hype, no generic spam.',
        'draft-linkedin':'Draft a LinkedIn message under 70 words to the primary contact, personal and specific to the notes. No hashtags.',
        'draft-whatsapp':'Draft a friendly WhatsApp message under 50 words to the primary contact, appropriate to where the conversation is. No emojis overload.',
        'draft-followup':'Draft a polite, specific follow-up message (under 80 words) that moves the conversation to the next concrete step, referencing the last activity.',
      };
      const key = kind==='draft' ? 'draft-'+ch : kind;
      await sample(`${RPS_CONTEXT}\n\nLead data:\n${brief}\n\n${prompts[key]}`, {modelTier:'default', onText:({text})=>{ if(S.ai[id]){ S.ai[id].text = text; const el = $('#ai-text-'+id); if(el) el.textContent = text; } }})
        .then(r=>{ S.ai[id] = {kind:key, text:r.text}; });
    }
  }catch(e){
    S.ai[id] = {kind, error: e?.message ? 'AI request failed: '+e.message : "Couldn't get a response. Try again."};
  }
  S.ai[id].loading = false; refreshAI(id);
}

/* ---------- Events ---------- */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-a]');
  if(!e.target.closest('.searchwrap')) { const b = $('#sres'); if(b) b.innerHTML=''; }
  if(!t) { if(S.ui.navOpen && !e.target.closest('.side')){ S.ui.navOpen=false; render(); } return; }
  const a = t.dataset.a, id = t.dataset.id;
  const L = id ? S.leads[id] : null;
  switch(a){
    case 'open': if(e.target.closest('select,button:not([data-a="open"]),a')) return; go('lead/'+id); break;
    case 'kpi': { const k = t.dataset.k; S.ui.filters = {};
      if(k==='today'||k==='overdue') return go('followups');
      if(k==='reports') return go('reports');
      if(k==='month') S.ui.filters.month = thisMonth();
      if(k==='mine'){ if(myPid()){ if(isAdmin()) S.ui.pf = myPid(); S.ui.filters.state='active'; } }
      if(k==='unassigned'){ S.ui.filters.partner='none'; S.ui.filters.state='active'; if(isAdmin()) S.ui.pf='all'; }
      if(k==='hot'){ S.ui.filters.priority='hot'; S.ui.filters.state='active'; }
      if(k==='meeting') S.ui.filters.status='meeting';
      if(k==='proposal') S.ui.filters.status='proposal';
      if(k==='converted'){ S.ui.filters.state='converted'; }
      S.ui.search=''; go('leads'); break; }
    case 'togglefilters': S.ui.showFilters = !S.ui.showFilters; render(); break;
    case 'clearfilter': delete S.ui.filters[t.dataset.k]; render(); break;
    case 'clearfilters': S.ui.filters = {}; S.ui.search=''; render(); break;
    case 'export': exportSheet(); break;
    case 'complete': completeSheet(id); break;
    case 'resched': reschedSheet(id); break;
    case 'editnext': nextSheet(id); break;
    case 'owner': ownerSheet(id); break;
    case 'stagesheet': stageSheet(id); break;
    case 'pickstage': closeSheet(); requestStage(id, t.dataset.s); break;
    case 'closesheet': closeSheet(); break;
    case 'closesheet-bg': if(e.target===t) closeSheet(); break;
    case 'setdate': { const f = t.closest('form'); const inp = f && (t.dataset.f ? f.querySelector(`[name="${t.dataset.f}"]`) : f.querySelector('input[type=date]')); if(inp) inp.value = t.dataset.v; break; }
    case 'focus': { const el = document.getElementById(t.dataset.f); if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.focus({preventScroll:true}); } break; }
    case 'qa': { const tp = t.dataset.t; S.keep['acttype-'+id] = tp==='LinkedIn'?'LinkedIn':tp; const sel = document.querySelector(`[data-keep="acttype-${id}"]`); if(sel) sel.value = S.keep['acttype-'+id];
      setTimeout(()=>toast(`Log the ${tp==='Call'?'call':tp==='Email'?'email':'message'} when you're done.`,'',{a:'focus-act',id,label:'Log it'}),400); break; }
    case 'focus-act': { const el = document.getElementById('act-'+id); if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.focus({preventScroll:true}); } else go('lead/'+id); break; }
    case 'addact': { if(!L) return; const text = (S.keep['act-'+id]||'').trim(); if(!text) { toast('Write what happened first.','err'); document.getElementById('act-'+id)?.focus(); return; }
      const type = S.keep['acttype-'+id] || 'Call'; const at = S.keep['actat-'+id] ? new Date(S.keep['actat-'+id]).toISOString() : new Date().toISOString();
      const x = clone(L); x.activities = [...(x.activities||[]), {id:uid('a'), at, by:actor(), type, text}];
      if(CONTACT_TYPES.includes(type) && (!x.lastContacted || at.slice(0,10) > x.lastContacted)) x.lastContacted = at.slice(0,10);
      delete S.keep['act-'+id]; delete S.keep['actat-'+id];
      saveLead(x, 'Activity added.');
      if(x.next?.due && diffDays(x.next.due,today())<=0) setTimeout(()=>toast('Did that complete the next action?','',{a:'complete',id,label:'Complete it'}),350);
      break; }
    case 'addnote': { if(!L) return; const text = (S.keep['note-'+id]||'').trim(); if(!text){ toast('Write the note first.','err'); return; }
      const x = clone(L); x.notes = [...(x.notes||[]), {id:uid('n'), at:new Date().toISOString(), by:actor(), kind:t.dataset.t, text}];
      delete S.keep['note-'+id]; saveLead(x, t.dataset.t==='meeting'?'Meeting note added.':'Note added.'); break; }
    case 'notetab': S.ui.noteTab[id] = t.dataset.t; render(); break;
    case 'delete': openSheet(`<h2>Delete ${esc(L.company)}?</h2><p class="sub">This removes the lead, its activity and notes for everyone. It can't be undone.</p>`, 'Delete lead', ()=>{ deleteLead(id); closeSheet(); go('leads'); toast('Lead deleted.'); return 'keep'; });
      setTimeout(()=>{ const b = $('#sheetForm button[type=submit]'); if(b){ b.classList.remove('pri'); b.classList.add('danger'); } },0); break;
    case 'addcontact': collectForm(); S.form.draft.contacts.push({id:uid('c'),name:'',title:'',email:'',phone:'',whatsapp:'',linkedin:''}); render(); break;
    case 'rmcontact': collectForm(); S.form.draft.contacts.splice(+t.dataset.i,1); render(); break;
    case 'createanyway': submitLeadForm(true); break;
    case 'viewdup': S.form = null; break;
    case 'cancelform': S.form = null; break;
    case 'calmove': S.ui.calMonth = shiftMonth(S.ui.calMonth, +t.dataset.n); render(); break;
    case 'caltoday': S.ui.calMonth = thisMonth(); render(); break;
    case 'calday': { const d = t.dataset.d, list = calEvents().filter(x=>x.d===d); openSheet(`<h2>${fmtD(d)}</h2><div class="stack mt12" style="gap:6px">${list.map(x=>`<button type="button" class="ev ${x.cls}" style="font-size:14px;padding:9px 11px" data-a="sheetopen" data-id="${x.id}">${esc(x.label)}</button>`).join('')}</div>`, '', ()=>{}); break; }
    case 'sheetopen': closeSheet(); go('lead/'+id); break;
    case 'filterpartner': S.ui.pf = id; toast(`Showing ${pname(id)} across the app.`); go('dashboard'); break;
    case 'amleads': S.ui.filters = {am:id}; S.ui.pf='all'; go('leads'); break;
    case 'partnerleads': S.ui.filters = {partner:id}; go('leads'); break;
    case 'preview': S.ui.preview = id; toast(`Previewing as ${pname(id)}.`); go('dashboard'); break;
    case 'endpreview': S.ui.preview = null; render(); break;
    case 'takeseat': takeSeat(id); break;
    case 'chase': S.ui.chase = t.dataset.v; render(); break;
    case 'addmember': memberSheet(null); break;
    case 'editmember': memberSheet(id); break;
    case 'deactivate': closeSheet(); deactivateSheet(id); break;
    case 'reactivate': S.settings.partners = team().map(x=>x.id===id?{...x,active:true}:x); saveSettings(`${pname(id)} reactivated.`); break;
    case 'removemember': { const nm = pname(id); closeSheet(); if(leadCount(id)) return toast('This person still has leads. Deactivate instead.','err'); S.settings.partners = team().filter(x=>x.id!==id); saveSettings(`${nm} removed.`); break; }
    case 'skipseat': S.ui.skipSeat = true; if(S.mode==='db') DB.updateProfile(S.uid,{member_id:null, skipped:true}).catch(()=>{}); render(); break;
    case 'signout': sb?.auth.signOut(); break;
    case 'forgot': S.auth = S.auth==='forgot' ? 'signedout' : 'signedout'; S.authMode = S.authMode==='forgot' ? 'signin' : 'forgot'; S.authMsg=''; render(); break;
    case 'changepw': openSheet(`<h2>Change password</h2><p class="sub">At least 8 characters.</p><div class="stack"><label class="f req">New password<input class="input" type="password" name="pw" autocomplete="new-password"></label><label class="f req">Repeat new password<input class="input" type="password" name="pw2" autocomplete="new-password"></label></div>`, 'Change password', fd=>{ const a = String(fd.get('pw')||''), b = String(fd.get('pw2')||''); if(a.length<8) return 'Use at least 8 characters.'; if(a!==b) return "The passwords don't match."; sb.auth.updateUser({password:a}).then(({error})=>toast(error?"Couldn't change password: "+error.message:'Password changed.', error?'err':'')); }); break;
    case 'addsource': { const v = $('#newsource')?.value.trim(); if(!v) return; if(S.settings.sources.some(s=>s.toLowerCase()===v.toLowerCase())) return toast('That source already exists.','err');
      S.settings.sources = [...S.settings.sources, v]; saveSettings(`Lead source "${v}" added.`); break; }
    case 'rmsource': S.settings.sources = S.settings.sources.filter(s=>s!==t.dataset.v); saveSettings('Lead source removed.'); break;
    case 'loaddemo': openSheet(`<h2>Load demo data?</h2><p class="sub">Adds 42 fictional leads across all partners and stages${allLeads().length?'. Existing leads are kept':''}. Dates are set relative to today.</p>`, 'Load demo data', ()=>{ closeSheet(); loadDemo(); return 'keep'; }); break;
    case 'clearall': openSheet(`<h2>Delete all ${allLeads().length} leads?</h2><p class="sub">Every lead, activity and note will be removed for everyone. This can't be undone. Type DELETE to confirm.</p><input class="input" name="confirm" autocomplete="off">`, 'Delete everything', fd=>{ if(String(fd.get('confirm')).trim()!=='DELETE') return 'Type DELETE to confirm.'; closeSheet(); clearAll(); return 'keep'; }); break;
    case 'parsepaste': { const tx = $('#csvtext')?.value||''; if(!tx.trim()) return toast('Choose a file or paste CSV text first.','err'); prepareImport(tx); break; }
    case 'doimport': runImport(); break;
    case 'resetimport': S.importState = null; if(t.tagName==='BUTTON') render(); break;
    case 'ai': runAI(t.dataset.k, id); break;
    case 'ai-apply-next': { const d = S.ai[id]?.data; if(!d) return; const x = clone(L); x.next = {type:NEXT_TYPES.includes(d.type)?d.type:'Follow-up', text:d.text, due:addDays(today(),Math.max(0,+d.dueInDays||1)), reminder:'Morning of'}; delete S.ai[id]; saveLead(x, `Follow-up scheduled for ${fmtLong(x.next.due)}.`); break; }
    case 'ai-apply-score': { const d = S.ai[id]?.data; if(!d) return; const x = clone(L); x.score = Math.max(0,Math.min(100,+d.score||0)); if(['hot','warm','cold'].includes(d.priority)) x.priority = d.priority; delete S.ai[id]; saveLead(x, `Lead score set to ${x.score}.`); break; }
    case 'ai-copy': { const txt = S.ai[id]?.text||''; (navigator.clipboard?.writeText(txt)||Promise.reject()).then(()=>toast('Copied.')).catch(()=>{ const el = $('#ai-text-'+id); if(el){ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Text selected. Copy it with your keyboard or long-press.'); } }); break; }
    case 'moremenu': openSheet(`<h2>More</h2><div class="stack mt12" style="gap:8px">${[['calendar','Calendar','cal'],['reports','Reports','reports'],['partners','Team','partners'],['settings','Settings','settings']].map(([k,l,i])=>`<button type="button" class="btn" style="justify-content:flex-start;min-height:46px" data-a="sheetgo" data-h="${k}">${ic(i)} ${l}</button>`).join('')}${true?`<label class="f mt8">Show leads for<select class="input" data-c="pf">${opts([['all','Everyone'],...(myPid()?[['mine','My leads']]:[]),...teamOpts(),['none','Unassigned']], S.ui.pf)}</select></label>`:''}</div>`, '', ()=>{}); break;
    case 'sheetgo': closeSheet(); go(t.dataset.h); break;
    case 'navtoggle': S.ui.navOpen = !S.ui.navOpen; render(); break;
    case 'sresgo': case 'sresall': { const b = $('#sres'); if(b) b.innerHTML=''; if(a==='sresall') { S.ui.filters={}; } break; }
  }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && S.sheet) closeSheet();
  if((e.key==='Enter'||e.key===' ') && e.target.matches('[role="link"][data-a="open"],[role="button"][data-a]')){ e.preventDefault(); e.target.click(); }
  if(e.key==='Enter' && e.target.id==='gsearch'){ e.preventDefault(); S.ui.search = e.target.value; S.ui.filters={}; $('#sres').innerHTML=''; go('leads'); }
  if(e.key==='Enter' && e.target.id==='newsource'){ e.preventDefault(); document.querySelector('[data-a="addsource"]')?.click(); }
  if(e.key==='/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)){ e.preventDefault(); $('#gsearch')?.focus(); }
});
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset.keep){ S.keep[t.dataset.keep] = t.value; return; }
  if(t.id==='gsearch'){ showSearchResults(t.value); return; }
  if(t.id==='lsearch'){ S.ui.search = t.value; const g = $('#gsearch'); if(g) g.value = t.value; renderLeadResults(); return; }
});
document.addEventListener('change', e=>{
  const t = e.target, c = t.dataset.c, id = t.dataset.id;
  if(t.dataset.keep){ S.keep[t.dataset.keep] = t.value; return; }
  if(t.id==='csvfile' && t.files?.[0]){ const r = new FileReader(); r.onload = ()=>prepareImport(String(r.result)); r.readAsText(t.files[0]); return; }
  if(!c) return;
  switch(c){
    case 'pf': S.ui.pf = t.value; if(S.sheet) closeSheet(); render(); break;
    case 'sort': S.ui.sort = t.value; renderLeadResults(); break;
    case 'filter': if(t.value) S.ui.filters[t.dataset.k] = t.value; else delete S.ui.filters[t.dataset.k]; render(); break;
    case 'dashMonth': S.ui.dashMonth = t.value; render(); break;
    case 'repMonth': S.ui.repMonth = t.value; render(); break;
    case 'status': requestStage(id, t.value); if(S.sheet) t.value = S.leads[id].status; break;
    case 'move': requestStage(id, t.value); break;
    case 'priority': { const x = clone(S.leads[id]); x.priority = t.value; saveLead(x, `Priority set to ${t.options[t.selectedIndex].text}.`); break; }
    case 'assign': assignLead(id, t.value); break;
    case 'target': { const v = Math.max(1,+t.value||1); S.settings.targets = {...(S.settings.targets||{}), [S.ui.repMonth]: v}; saveSettings(`Target for ${monthLabel(S.ui.repMonth)} set to ${v}.`); break; }
    case 'deftarget': S.settings.defaultTarget = Math.max(1,+t.value||50); saveSettings('Default monthly target saved.'); break;
    case 'pname': { const v = t.value.trim(); if(!v) { t.value = pname(id); return; } S.settings.partners = S.settings.partners.map(p=>p.id===id?{...p,name:v}:p); saveSettings(`Partner renamed to ${v}.`); break; }
    case 'localrole': S.localRole = {...S.localRole, role:t.value}; persistLocal(); toast(`Now using the app as ${t.value==='admin'?'an admin':'a partner'}.`); render(); break;
    case 'localseat': S.localRole = {...S.localRole, partnerId:t.value||null}; persistLocal(); render(); break;
    case 'myseat': takeSeat(t.value||null); break;
    case 'theme': if(t.value) document.documentElement.dataset.theme = t.value; else delete document.documentElement.dataset.theme; try{ localStorage.setItem('rps-theme', t.value); }catch(_){}; break;
    case 'setseat': DB.updateProfile(t.dataset.u, {member_id:t.value||null, skipped:false}).then(loadProfiles).then(()=>{ render(); toast(t.value?`Login linked to ${pname(t.value)}.`:'Login unlinked.'); }).catch(e=>toast(writeErr(e),'err')); break;
    case 'setadmin': DB.updateProfile(t.dataset.u, {is_admin:t.checked}).then(loadProfiles).then(()=>{ render(); toast(t.checked?'Admin access granted.':'Admin access removed.'); }).catch(e=>{ t.checked=!t.checked; toast(writeErr(e),'err'); }); break;
    case 'impPartner': S.importState.partnerId = t.value; break;
    case 'impMonth': S.importState.month = t.value; break;
    case 'impDups': S.importState.includeDups = t.value==='include'; render(); break;
  }
});
document.addEventListener('submit', e=>{
  e.preventDefault();
  if(e.target.id==='leadForm'){ submitLeadForm(false); return; }
  if(e.target.id==='authForm'){ submitAuth(new FormData(e.target)); return; }
  if(e.target.id==='sheetForm' && S.sheet){
    const res = S.sheet.onSubmit(new FormData(e.target));
    if(typeof res==='string' && res!=='keep'){ $('#sheetErr').textContent = res; return; }
    if(res!=='keep') closeSheet();
  }
});
document.addEventListener('focusout', ()=>{ setTimeout(()=>{ if(S.pending && !busy()) render(); }, 60); });
// Drag & drop on the pipeline (desktop); touch devices use the stage menu on each card
let dragId = null;
document.addEventListener('dragstart', e=>{ const c = e.target.closest?.('[data-drag]'); if(!c) return; dragId = c.dataset.drag; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try{ e.dataTransfer.setData('text/plain', dragId); }catch(_){} });
document.addEventListener('dragend', e=>{ e.target.closest?.('[data-drag]')?.classList.remove('dragging'); document.querySelectorAll('.colm.drop').forEach(x=>x.classList.remove('drop')); });
document.addEventListener('dragover', e=>{ const col = e.target.closest?.('[data-drop]'); if(!col || !dragId) return; e.preventDefault(); document.querySelectorAll('.colm.drop').forEach(x=>x!==col&&x.classList.remove('drop')); col.classList.add('drop'); });
document.addEventListener('drop', e=>{ const col = e.target.closest?.('[data-drop]'); if(!col || !dragId) return; e.preventDefault(); col.classList.remove('drop'); const id = dragId; dragId = null; requestStage(id, col.dataset.drop); });
window.addEventListener('hashchange', ()=>{ S.ui.navOpen = false; const r = route(); if(r.name!=='new' && r.sub!=='edit') S.form = null; if(S.sheet) closeSheet(); render(); });
// Show the tablet nav toggle only when the rail is collapsed
const mq = window.matchMedia('(max-width:1023px) and (min-width:720px)');
const syncToggle = () => document.querySelectorAll('.navtoggle').forEach(b=>b.style.display = mq.matches ? '' : 'none');
new MutationObserver(syncToggle).observe(document.getElementById('root'), {childList:true});
mq.addEventListener?.('change', syncToggle);

/* ---------- Actions needing the data layer ---------- */
async function takeSeat(pid){
  if(S.mode!=='db'){ S.localRole.partnerId = pid; persistLocal(); render(); return; }
  S.members = {...S.members, [S.uid]:{...(S.members[S.uid]||{}), partnerId:pid||null, skipped:!pid}};
  render();
  try{ await DB.updateProfile(S.uid, {member_id:pid||null, skipped:!pid}); toast(pid ? `You're ${pname(pid)}.` : 'Seat cleared.'); }
  catch(e){ toast(writeErr(e),'err'); }
}
async function loadDemo(){
  const demo = Object.values(buildDemo());
  toast('Loading demo data…');
  const res = await bulkWrite(demo);
  render(); toast(`${res.ok} demo leads loaded.${res.failed?` ${res.failed} failed.`:''}`, res.failed?'err':'');
}
async function clearAll(){
  const ids = Object.keys(S.leads); S.leads = {}; render();
  if(S.mode==='db'){ try{ await DB.deleteAll(); }catch(e){ toast(writeErr(e),'err'); } } else persistLocal();
  toast('All leads deleted.');
}

/* ---------- Auth ---------- */
function authView(){
  const recovery = S.auth==='recovery', forgot = S.authMode==='forgot';
  const msg = S.authMsg ? `<p class="small mt12" style="color:${S.authMsgErr?'var(--red)':'var(--green)'}">${esc(S.authMsg)}</p>` : '';
  const body = recovery ? `<h1>Set a new password</h1><p class="muted">Choose a password with at least 8 characters.</p>
      <div class="stack mt16"><label class="f">New password<input class="input" type="password" name="pw" autocomplete="new-password" required></label>
      <label class="f">Repeat new password<input class="input" type="password" name="pw2" autocomplete="new-password" required></label>
      <button class="btn pri" type="submit">Save password</button></div>`
    : forgot ? `<h1>Reset your password</h1><p class="muted">We'll email you a link to set a new one.</p>
      <div class="stack mt16"><label class="f">Email<input class="input" type="email" name="email" autocomplete="email" value="${esc(S.lastEmail||'')}" required></label>
      <button class="btn pri" type="submit">Send reset link</button><button type="button" class="linkbtn" data-a="forgot">Back to sign in</button></div>`
    : `<h1>Sign in</h1><p class="muted">Rock Paper Scissors growth pipeline. Ask an admin if you need a login.</p>
      <div class="stack mt16"><label class="f">Email<input class="input" type="email" name="email" autocomplete="email" value="${esc(S.lastEmail||'')}" required></label>
      <label class="f">Password<input class="input" type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn pri" type="submit">Sign in</button><button type="button" class="linkbtn" data-a="forgot">Forgot password?</button></div>`;
  return `<div class="authwrap"><form class="card authcard" id="authForm" novalidate>${logo(30)}${body}${msg}</form></div>`;
}
async function submitAuth(fd){
  const g = k => String(fd.get(k)||'').trim();
  const say = (m, err=true) => { S.authMsg = m; S.authMsgErr = err; render(); };
  if(S.auth==='recovery'){
    if(g('pw').length<8) return say('Use at least 8 characters.');
    if(g('pw')!==g('pw2')) return say("The passwords don't match.");
    const { error } = await sb.auth.updateUser({ password:g('pw') });
    if(error) return say(error.message);
    S.authMsg=''; S.auth='in'; history.replaceState(null,'',location.pathname+'#/dashboard'); toast('Password saved.');
    const { data } = await sb.auth.getSession(); if(data.session) startSession(data.session); return;
  }
  S.lastEmail = g('email');
  if(!g('email')) return say('Enter your email.');
  if(S.authMode==='forgot'){
    const { error } = await sb.auth.resetPasswordForEmail(g('email'), { redirectTo: location.origin + location.pathname });
    return error ? say(error.message) : say('If that email has a login, a reset link is on its way.', false);
  }
  if(!g('password')) return say('Enter your password.');
  say('Signing in…', false);
  const { error } = await sb.auth.signInWithPassword({ email:g('email'), password:g('password') });
  if(error) say(error.message==='Invalid login credentials' ? 'That email and password combination is not recognised.' : error.message);
}
function makeAI(){
  // Calls the optional "ai" Supabase Edge Function, which holds the Anthropic API key server-side.
  const call = async prompt => {
    const { data, error } = await sb.functions.invoke('ai', { body:{ prompt } });
    if(error) throw { message: error.message || 'the AI function is not set up' };
    if(data?.error) throw { message: data.error };
    return data?.text || '';
  };
  const f = async (prompt, opts={}) => { const text = await call(prompt); opts.onText?.({text, delta:text}); return {text, truncated:false}; };
  f.json = async prompt => { const t = (await call(prompt + '\n\nRespond with the JSON object only, no code fences or commentary.')).replace(/```json|```/g,'');
    return JSON.parse(t.slice(t.indexOf('{'), t.lastIndexOf('}')+1)); };
  return f;
}

/* ---------- Init ---------- */
async function loadProfiles(){
  const { data, error } = await sb.from('profiles').select('user_id,email,member_id,is_admin,skipped');
  if(error) throw error;
  const m = {}; (data||[]).forEach(p=>m[p.user_id] = {partnerId:p.member_id, skipped:p.skipped, email:p.email, isAdmin:p.is_admin});
  S.members = m; S.membersLoaded = true; S.isOwnerAdmin = !!m[S.uid]?.isAdmin;
}
async function loadAll(){
  const L = {}; let from = 0;
  for(;;){ const { data, error } = await sb.from('leads').select('id,data').order('id').range(from, from+999); if(error) throw error;
    data.forEach(r=>{ L[r.id] = r.data; }); if(data.length<1000) break; from += 1000; }
  S.leads = L; S.leadsLoaded = true;
  const { data:st, error:se } = await sb.from('settings').select('data').eq('id',1).maybeSingle(); if(se) throw se;
  S.settings = {...clone(DEFAULT_SETTINGS), ...(st?.data||{})};
  await loadProfiles();
}
function subscribe(){
  if(channel) sb.removeChannel(channel);
  channel = sb.channel('crm-live')
    .on('postgres_changes', {event:'*', schema:'public', table:'leads'}, p=>{ if(p.eventType==='DELETE'){ delete S.leads[p.old?.id]; } else if(p.new?.data){ S.leads[p.new.id] = p.new.data; } scheduleRender(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'settings'}, p=>{ if(p.new?.data){ S.settings = {...clone(DEFAULT_SETTINGS), ...p.new.data}; scheduleRender(); } })
    .on('postgres_changes', {event:'*', schema:'public', table:'profiles'}, ()=>{ loadProfiles().then(scheduleRender).catch(()=>{}); })
    .subscribe();
}
async function autoLinkSeat(){
  // If this login's email matches a team member's email, link them automatically.
  const mine = S.members[S.uid]; if(!mine || mine.partnerId || mine.skipped) return;
  const match = activeTeam().find(m=>m.email && m.email.toLowerCase()===String(S.email).toLowerCase());
  if(match){ try{ await DB.updateProfile(S.uid, {member_id:match.id}); mine.partnerId = match.id; }catch(_){} }
}
async function startSession(session){
  if(S.starting === session.user.id || (S.auth==='in' && S.uid===session.user.id && S.ready)) return;
  S.starting = session.user.id;
  S.uid = session.user.id; S.email = session.user.email; S.auth = 'in'; S.authMsg=''; S.ready = false; render();
  try{ await loadAll(); await autoLinkSeat(); subscribe(); }
  catch(e){ console.error(e); toast("Couldn't load data from the database. Check the setup steps.", 'err'); }
  S.ready = true; S.starting = null; render();
}
async function init(){
  try{ const th = localStorage.getItem('rps-theme'); if(th) document.documentElement.dataset.theme = th; }catch(_){}
  const cfg = window.RPS_CONFIG || {};
  const configured = !!(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && !/YOUR[-_]/i.test(cfg.SUPABASE_URL + cfg.SUPABASE_ANON_KEY));
  if(!configured || !window.supabase?.createClient){
    // Demo mode: no database configured. Everything works, saved in this browser only.
    S.mode = 'local'; S.setup = configured ? 'lib' : 'config';
    try{ const saved = JSON.parse(localStorage.getItem(LS_KEY)||'null'); if(saved){ S.leads = saved.leads||{}; S.settings = {...clone(DEFAULT_SETTINGS), ...(saved.settings||{})}; S.localRole = saved.role||S.localRole; } }catch(_){}
    if(!Object.keys(S.leads).length){ S.leads = buildDemo(); persistLocal(); }
    S.ready = true; render(); return;
  }
  sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  S.mode = 'db';
  S.cap = { sample: cfg.AI_ENABLED ? makeAI() : null };
  sb.auth.onAuthStateChange((event, session)=>{
    setTimeout(()=>{
      if(event==='PASSWORD_RECOVERY'){ S.auth = 'recovery'; S.authMsg=''; render(); return; }
      if(event==='SIGNED_OUT'){ if(channel){ sb.removeChannel(channel); channel = null; } S.auth = 'signedout'; S.authMode='signin'; S.leads = {}; S.members = {}; S.uid = null; S.ui.preview = null; render(); return; }
      if(session && S.auth!=='recovery' && (event==='SIGNED_IN' || event==='INITIAL_SESSION')) startSession(session);
      if(!session && event==='INITIAL_SESSION'){ S.auth = 'signedout'; render(); }
    }, 0);
  });
  // Refresh when the tab comes back into view, so reassigned leads disappear or appear correctly.
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && S.auth==='in' && S.ready && !busy()) loadAll().then(render).catch(()=>{}); });
}
render();
init();
</script>
