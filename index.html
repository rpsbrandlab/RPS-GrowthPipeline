<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RPS Growth Pipeline</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9C%82%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --surface-2:#F7F8FA; --line:#E2E4EA; --line-2:#D3D6DF;
  --ink:#1A1D26; --ink-2:#3B4050; --muted:#666C7C;
  --accent:#2F43E8; --accent-ink:#FFFFFF; --accent-soft:#E9EBFD;
  --red:#C2321F; --red-soft:#FCECE9; --amber:#9A5B00; --amber-soft:#FFF2DA;
  --green:#0F7A57; --green-soft:#E2F4EC; --violet:#6B38C7; --violet-soft:#F0E9FB;
  --p1:#2F43E8; --p2:#0B8577; --p3:#B0277A;
  --c0:#2F43E8; --c1:#0B8577; --c2:#B0277A; --c3:#B45309; --c4:#6B38C7; --c5:#0369A1; --c6:#4D7C0F; --c7:#BE123C;
  --r-lg:16px; --r:11px; --r-sm:8px;
  --shadow:0 1px 0 rgba(20,24,40,.04), 0 6px 20px -12px rgba(20,24,40,.18);
  --font:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display:"Bricolage Grotesque", "Geist", ui-sans-serif, system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1117; --surface:#161A22; --surface-2:#1B2029; --line:#272D39; --line-2:#343B49;
    --ink:#E9EBF1; --ink-2:#C5C9D4; --muted:#9298A7;
    --accent:#7F8CFF; --accent-ink:#0E1117; --accent-soft:#1F2550;
    --red:#FF8A75; --red-soft:#3A1D19; --amber:#F3B656; --amber-soft:#35290F;
    --green:#5AD3A5; --green-soft:#11302A; --violet:#B99BFF; --violet-soft:#2A2145;
    --p1:#7F8CFF; --p2:#3CC7B5; --p3:#F07CC3;
    --c0:#7F8CFF; --c1:#3CC7B5; --c2:#F07CC3; --c3:#F3B656; --c4:#B99BFF; --c5:#5BB8F0; --c6:#9BD45A; --c7:#FF7A93;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1117; --surface:#161A22; --surface-2:#1B2029; --line:#272D39; --line-2:#343B49;
  --ink:#E9EBF1; --ink-2:#C5C9D4; --muted:#9298A7;
  --accent:#7F8CFF; --accent-ink:#0E1117; --accent-soft:#1F2550;
  --red:#FF8A75; --red-soft:#3A1D19; --amber:#F3B656; --amber-soft:#35290F;
  --green:#5AD3A5; --green-soft:#11302A; --violet:#B99BFF; --violet-soft:#2A2145;
  --p1:#7F8CFF; --p2:#3CC7B5; --p3:#F07CC3;
  --c0:#7F8CFF; --c1:#3CC7B5; --c2:#F07CC3; --c3:#F3B656; --c4:#B99BFF; --c5:#5BB8F0; --c6:#9BD45A; --c7:#FF7A93;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
h1{font-size:clamp(28px,4vw,40px);font-weight:800;line-height:1.05}
h2{font-size:19px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
.ic{flex:none;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Layout */
.app{display:flex;min-height:100vh}
.side{width:236px;flex:none;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--surface);padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;text-decoration:none}
.brand b{font-family:var(--display);font-weight:800;font-size:16px;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;text-decoration:none;color:var(--ink-2);font-weight:500}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav .count{margin-left:auto;font-size:12px;font-weight:600;background:var(--red);color:#fff;border-radius:99px;padding:0 7px;line-height:19px}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0}
.me{display:flex;align-items:center;gap:10px;font-size:13px}
.me small{display:block;color:var(--muted)}
.maincol{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 24px}
.top .searchwrap{position:relative;flex:1;max-width:460px}
.top .mobile-brand{display:none}
main{padding:24px;max-width:1360px;width:100%;margin:0 auto}
.bottom{display:none}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;line-height:1.2;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn.sm{padding:5px 9px;font-size:13px;min-height:32px;border-radius:8px}
.btn.icon{padding:0;width:38px}
.btn.sm.icon{width:32px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 11px;min-height:38px;outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{min-height:84px;resize:vertical;line-height:1.45}
.search{padding-left:36px}
.searchwrap .ic{position:absolute;left:11px;top:10px;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--ink-2)}
label.f .hint{font-weight:400;color:var(--muted);font-size:12px}
label.f{position:relative}
.req::after{content:"Required";color:var(--muted);font-size:11.5px;font-weight:400;position:absolute;top:1px;right:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.strong{font-weight:600}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.page-h p{color:var(--muted);margin-top:6px}

/* Chips & badges */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;line-height:18px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.chip.blue{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.violet{background:var(--violet-soft);color:var(--violet);border-color:transparent}
.chip.amber{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.green{background:var(--green-soft);color:var(--green);border-color:transparent}
.chip.red{background:var(--red-soft);color:var(--red);border-color:transparent}
.chip.dashed{border-style:dashed;background:transparent}
.chip.hot{background:var(--red);color:#fff;border-color:transparent}
.chip.warm{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.cold{background:var(--surface-2);color:var(--muted)}
.toggle-chip{cursor:pointer;user-select:none}
.toggle-chip input{position:absolute;opacity:0;pointer-events:none}
.toggle-chip:has(input:checked){background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toggle-chip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.due{font-weight:600;font-size:13px;white-space:nowrap}
.due.over{color:var(--red)}
.due.today{color:var(--amber)}
.pglyph{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pglyph svg{flex:none}
.score{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.score i{display:block;width:34px;height:5px;border-radius:9px;background:var(--line);overflow:hidden}
.score i b{display:block;height:100%;background:var(--accent);border-radius:9px}

/* Dashboard */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.hero .hello{color:var(--muted);font-weight:500;margin-bottom:6px}
.hero h1{font-size:clamp(34px,5.4vw,58px);letter-spacing:-.025em}
.chase-sum{margin-top:10px;font-size:17px;color:var(--ink-2)}
.chase-sum b.r{color:var(--red)} .chase-sum b.a{color:var(--amber)}
.dash{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi:hover{border-color:var(--line-2)}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.red .v{color:var(--red)} .kpi.amber .v{color:var(--amber)} .kpi.green .v{color:var(--green)}
.agroup + .agroup{margin-top:16px}
.agroup h3{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-family:var(--font);font-size:13px;font-weight:600;color:var(--muted)}
.agroup h3 .n{color:var(--ink)}
.aitem{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px 10px 0;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);text-decoration:none;margin-bottom:6px;cursor:pointer}
.aitem:hover{border-color:var(--line-2)}
.aitem .bar{align-self:stretch;border-radius:0 4px 4px 0;background:var(--line-2)}
.aitem.over{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 30%,transparent)}
.aitem.over .bar{background:var(--red)}
.aitem.today .bar{background:var(--amber)}
.aitem .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aitem .s{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.warnbar{display:flex;align-items:center;gap:12px;border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);background:var(--amber-soft);color:var(--amber);border-radius:var(--r);padding:11px 14px;margin-bottom:16px;font-weight:500;flex-wrap:wrap}
.warnbar .btn{margin-left:auto}
.funnel{display:flex;flex-direction:column;gap:6px}
.fstep{display:grid;grid-template-columns:110px minmax(0,1fr) 72px;gap:10px;align-items:center;font-size:13.5px}
.fstep .track{height:26px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.fstep .fill{height:100%;background:var(--accent);border-radius:7px;min-width:3px;opacity:.9}
.fstep:last-child .fill{background:var(--green)}
.fstep .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.fstep .num small{color:var(--muted);font-weight:500;margin-left:4px}
.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mstat{padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.mstat b{font-family:var(--display);font-size:22px;display:block;line-height:1.1}
.mstat span{font-size:12.5px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:6px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;min-width:0}
.bars .pair{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center}
.bars .b1{width:42%;max-width:18px;background:var(--line-2);border-radius:4px 4px 0 0}
.bars .b2{width:42%;max-width:18px;background:var(--green);border-radius:4px 4px 0 0}
.bars .col.on .b1{background:var(--accent)}
.bars small{font-size:11.5px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.prow{display:grid;grid-template-columns:minmax(120px,1.2fr) repeat(5,minmax(0,1fr));gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.prow.h{border-top:0;font-size:12.5px;color:var(--muted);font-weight:500;padding-top:0}
.prow .w{height:6px;border-radius:9px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.prow .w b{display:block;height:100%;border-radius:9px}

/* Tables & lists */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:1080px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl .co{font-weight:600}
.tbl .sub{color:var(--muted);font-size:12.5px}
.tbl .nx{max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl.compact{min-width:640px}
.tbl.compact td,.tbl.compact th{padding:9px 12px}
.tbl.compact tbody tr{cursor:default}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.lcards{display:none;flex-direction:column;gap:8px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;cursor:pointer}
.lcard.over{border-left:4px solid var(--red)}
.lcard.today{border-left:4px solid var(--amber)}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:12px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.activechips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.activechips .chip{cursor:pointer}
.empty{text-align:center;padding:38px 18px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:18px;margin-bottom:4px}
.empty .btn{margin-top:14px}

/* Lead detail */
.lead-h{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.lead-h h1{font-size:clamp(26px,3.6vw,38px)}
.lead-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.lead-meta select{min-height:32px;padding:4px 8px;font-size:13px;border-radius:8px;width:auto}
.qa{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.qa .btn{min-height:36px}
.ldgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.next{border:2px solid var(--accent);background:linear-gradient(0deg,var(--surface),var(--surface)) padding-box;position:relative}
.next.over{border-color:var(--red)}
.next.today{border-color:var(--amber)}
.next .what{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.2;margin:4px 0 6px}
.next .lbl{font-size:13px;font-weight:600;color:var(--accent)}
.next.over .lbl{color:var(--red)}.next.today .lbl{color:var(--amber)}
.alertbox{border:1px dashed var(--amber);background:var(--amber-soft);color:var(--amber);border-radius:var(--r-lg);padding:16px}
.alertbox b{display:flex;gap:8px;align-items:center;font-family:var(--display);font-size:17px}
.alertbox p{color:var(--ink-2);margin:6px 0 12px}
.timeline{position:relative;margin-top:6px}
.tl{display:grid;grid-template-columns:62px 18px minmax(0,1fr);gap:8px;padding:8px 0}
.tl .d{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.3;padding-top:1px}
.tl .d b{display:block;color:var(--ink);font-weight:600;font-size:13px}
.tl .dot{position:relative}
.tl .dot::before{content:"";position:absolute;left:8px;top:16px;bottom:-14px;width:1px;background:var(--line-2)}
.tl:last-child .dot::before{display:none}
.tl .dot i{display:block;width:12px;height:12px;border-radius:50%;margin:4px 0 0 2px;background:var(--surface);border:3px solid var(--accent)}
.tl .body .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.tl .body p{margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere}
.composer{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px;padding:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.composer textarea{grid-column:1/-1;min-height:64px}
.composer .row{grid-column:1/-1;justify-content:flex-end}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.contact-name{font-family:var(--display);font-size:19px;font-weight:700}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:10px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:5px 11px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.note{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.note p{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px}
.ai-out{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;margin-top:10px;overflow-wrap:anywhere}
.banner{border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:14px}
.banner.green{background:var(--green-soft);color:var(--green)}
.banner.red{background:var(--red-soft);color:var(--red)}
.banner.grey{background:var(--surface-2);border:1px dashed var(--line-2);color:var(--ink-2)}
.preview-banner{background:var(--violet-soft);color:var(--violet);padding:8px 24px;font-size:13.5px;display:flex;gap:10px;align-items:center}

/* Pipeline */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:flex-start;scroll-snap-type:x proximity}
.colm{flex:0 0 272px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);display:flex;flex-direction:column;max-height:calc(100vh - 210px);scroll-snap-align:start}
.colm.drop{border-color:var(--accent);background:var(--accent-soft)}
.colm-h{padding:12px 13px 8px;display:flex;align-items:center;gap:8px}
.colm-h h3{font-size:14px}
.colm-h .n{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.colm-v{padding:0 13px 8px;font-size:12px;color:var(--muted)}
.colm-b{padding:0 8px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:7px;min-height:60px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;cursor:grab;font-size:13px}
.pcard:hover{border-color:var(--line-2)}
.pcard.dragging{opacity:.4}
.pcard .co{font-weight:600;font-size:14px}
.pcard .nx{color:var(--ink-2);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .mv{display:none;margin-top:8px}
.sdot{width:9px;height:9px;border-radius:50%;flex:none}

/* Follow-ups */
.fsec{margin-bottom:22px}
.fsec-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.fsec-h .n{font-weight:600;color:var(--muted)}
.fitem{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px}
.fitem.over{border-left:4px solid var(--red);background:color-mix(in srgb,var(--red-soft) 55%,var(--surface))}
.fitem.today{border-left:4px solid var(--amber)}
.fitem.none{border-left:4px dashed var(--amber)}
.fitem .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.fitem .open{cursor:pointer;min-width:0}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--line);gap:1px}
.cal .dow{background:var(--surface-2);padding:8px;font-size:12px;font-weight:600;color:var(--muted)}
.cal .day{background:var(--surface);min-height:112px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .day.out{background:var(--surface-2)}
.cal .day.out .dn{opacity:.45}
.cal .day .dn{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:2px}
.cal .day.td .dn{color:var(--accent-ink);background:var(--accent);border-radius:99px;width:24px;height:24px;display:grid;place-items:center}
.ev{font-size:11.5px;line-height:1.3;padding:3px 6px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;text-align:left;width:100%}
.ev.meeting{background:var(--violet-soft);color:var(--violet)}
.ev.call,.ev.followup{background:var(--accent-soft);color:var(--accent)}
.ev.proposal{background:var(--amber-soft);color:var(--amber)}
.ev.recontact{background:var(--surface-2);color:var(--ink-2);border:1px dashed var(--line-2)}
.ev.over{background:var(--red-soft);color:var(--red)}
.ev.more{background:transparent;color:var(--muted)}
.agenda{display:none}
.agenda .aday{margin-bottom:14px}
.agenda .aday h3{font-family:var(--font);font-size:13px;color:var(--muted);margin-bottom:6px}
.agenda .ev{font-size:14px;padding:9px 11px;white-space:normal;margin-bottom:5px}

/* Reports */
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.progress{height:10px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.progress b{display:block;height:100%;background:var(--accent);border-radius:9px}
.hbar{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13.5px;margin-bottom:7px}
.hbar .t{height:14px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.hbar .t b{display:block;height:100%;background:var(--red);opacity:.75;border-radius:5px}
.hbar .num{text-align:right;font-weight:600}
.target{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:14px}
.target div{background:var(--surface-2);border-radius:10px;padding:10px}
.target b{font-family:var(--display);font-size:22px;display:block}
.target span{font-size:12px;color:var(--muted)}

/* Partners */
.pcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.pstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}
.pstats div{background:var(--surface-2);border-radius:10px;padding:9px 11px}
.pstats b{font-family:var(--display);font-size:20px;display:block}
.pstats span{font-size:12px;color:var(--muted)}

/* Form */
.fsect{margin-bottom:16px}
.fsect h2{margin-bottom:14px}
.svc{display:flex;flex-wrap:wrap;gap:6px}
.svc .chip{padding:5px 11px;font-size:13px;position:relative}
.dup{border:1px solid var(--amber);background:var(--amber-soft);border-radius:var(--r-lg);padding:16px;margin-bottom:16px}
.dup b.t{font-family:var(--display);font-size:18px;color:var(--amber);display:block}
.dupitem{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--surface);border-radius:10px;padding:10px 12px;margin-top:10px;flex-wrap:wrap}
.contact-block{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--surface-2)}
.formbar{position:sticky;bottom:0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}

/* Sheet & toasts */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.42);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:18px;width:min(520px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:20px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.sheet h2{margin-bottom:4px}
.sheet .sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.sheet .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.quickdates{display:flex;gap:6px;flex-wrap:wrap}
.toasts{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--ink);color:var(--bg);padding:11px 15px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 12px 30px -10px rgba(0,0,0,.35);display:flex;gap:12px;align-items:center;animation:tin .18s ease-out}
.toast.err{background:var(--red);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.sres{position:absolute;left:0;right:0;top:44px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px -16px rgba(0,0,0,.3);overflow:hidden;z-index:30}
.sres a{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;text-decoration:none;border-bottom:1px solid var(--line);font-size:14px}
.sres a:last-child{border-bottom:0}
.sres a:hover,.sres a.hl{background:var(--surface-2)}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
.authwrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.authcard{width:min(420px,100%)}
.authcard h1{font-size:30px;margin:18px 0 6px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:14px;text-decoration:underline}
.seat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}
.seat button{padding:18px;border:1px solid var(--line-2);border-radius:14px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:600}
.seat button:hover{border-color:var(--accent)}
.seat button small{font-weight:400}
.tm{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.tm:first-child{border-top:0}
.tm.off{opacity:.55}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{cursor:pointer;display:grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line-2);position:relative}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches label:has(input:checked){border:2px solid var(--ink)}
.swatches label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.rolegroup + .rolegroup{margin-top:26px}
.rolegroup > h2{margin-bottom:12px}

/* Responsive */
@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(5,minmax(0,1fr))}
  .dash{grid-template-columns:minmax(0,1fr)}
  .ldgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:1023px){
  .side{width:68px;padding:16px 10px}
  .side .brand>div,.nav a span,.nav .count,.side-foot .me>div{display:none}
  .nav a{justify-content:center;padding:10px}
  .side.open{width:236px;position:fixed;z-index:50;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .side.open .brand>div,.side.open .nav a span,.side.open .nav .count,.side.open .side-foot .me>div{display:block}
  .side.open .nav a{justify-content:flex-start}
  .pcards{grid-template-columns:minmax(0,1fr)}
  .rgrid{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:719px){
  .side{display:none}
  .top{padding:8px 12px;gap:8px}
  .top .mobile-brand{display:flex}
  .top .pf,.top .addlead span{display:none}
  main{padding:16px 14px 96px}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px env(safe-area-inset-bottom,0px)}
  .bottom a,.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 0;text-decoration:none;color:var(--muted);background:none;border:0;position:relative;cursor:pointer}
  .bottom .on{color:var(--accent)}
  .bottom .count{position:absolute;top:2px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10px;border-radius:99px;padding:0 5px;line-height:16px}
  .kpis{display:flex;overflow-x:auto;gap:8px;margin:0 -14px 16px;padding:0 14px 4px;scroll-snap-type:x proximity}
  .kpi{flex:0 0 128px;scroll-snap-align:start;padding:10px 11px}
  .kpi .v{font-size:22px}
  .kpi .l{white-space:normal;line-height:1.25}
  .hero{margin-bottom:14px}
  .hero > .row{display:none}
  .lead-h{flex-direction:column}
  .lead-h > .row{order:-1;justify-content:flex-end;margin-bottom:-6px}
  .qa{flex-wrap:nowrap;overflow-x:auto;margin:0 -14px 16px;padding:0 14px 4px}
  .toolbar .searchwrap{flex:1 1 100%;max-width:none!important}
  .page-h > .row .btn{flex:1}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .tbl-wrap.leads-tbl{display:none}
  .lcards{display:flex}
  .fitem{grid-template-columns:minmax(0,1fr)}
  .fitem .acts{justify-content:flex-start}
  .cal{display:none}
  .agenda{display:block}
  .pcard .mv{display:block}
  .colm{flex-basis:84vw;max-height:none}
  .prow{grid-template-columns:minmax(90px,1fr) repeat(5,minmax(0,1fr));font-size:13px;gap:6px}
  .target{grid-template-columns:repeat(4,minmax(0,1fr))}
  .seat{grid-template-columns:minmax(0,1fr)}
  .mstats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fstep{grid-template-columns:86px minmax(0,1fr) 64px}
  .scrim{align-items:flex-end;padding:0}
  .sheet{border-radius:18px 18px 0 0;max-height:88vh;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .toasts{left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));align-items:stretch}
  .composer{grid-template-columns:minmax(0,1fr)}
  .formbar{bottom:calc(58px + env(safe-area-inset-bottom,0px))}
  .preview-banner{padding:8px 14px}
}
</style>

<body>
<div id="root"><div class="loading">Loading the pipeline…</div></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<div id="sheet"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
"use strict";
/* ============================================================
   RPS Growth Pipeline — internal lead-conversion CRM
   Structure: constants → utils → state → demo data → data layer →
   derived metrics → UI atoms → views → sheets → AI → events → init
   ============================================================ */

/* ---------- Constants ---------- */
const STAGES = [
  {k:'new',l:'New',r:1,tone:''},
  {k:'researching',l:'Researching',r:1,tone:''},
  {k:'no_contact',l:'Contact not made',r:1,tone:''},
  {k:'initial',l:'Initial contact',r:2,tone:'blue'},
  {k:'followup',l:'Follow-up',r:2,tone:'blue'},
  {k:'meeting',l:'Meeting booked',r:3,tone:'violet'},
  {k:'qualified',l:'Qualified',r:4,tone:'violet'},
  {k:'proposal',l:'Proposal',r:5,tone:'amber'},
  {k:'negotiation',l:'Negotiation',r:6,tone:'amber'},
  {k:'converted',l:'Converted',r:7,tone:'green'},
  {k:'rejected',l:'Rejected',r:0,tone:'red'},
  {k:'notnow',l:'Not now',r:0,tone:'dashed'},
  {k:'unresponsive',l:'Unresponsive',r:0,tone:''},
];
const ST = Object.fromEntries(STAGES.map(s=>[s.k,s]));
const CLOSED = ['converted','rejected','unresponsive'];          // no next action required
const FUNNEL = [['Prospects',0],['Contacted',2],['Meetings',3],['Qualified',4],['Proposals',5],['Negotiation',6],['Converted',7]];
const INDUSTRIES = ['Restaurants','Hospitality','Financial Services','Professional Services','E-commerce','Retail','Technology','Healthcare','Real Estate','Startups','Other'];
const DEFAULT_SOURCES = ['LinkedIn','Instagram','Facebook','Google','Website research','Referral','Existing network','Partner referral','Event','Cold outreach','Other'];
const SERVICES = ['Social Media Management','Social Media Strategy','Content Production','Paid Social','Website','Brand Identity','AI Software','AI Automation','AI Agents','Chatbots','Document Processing','CRM / Integrations','AI Consulting','Other'];
const ACT_TYPES = ['Call','Email','WhatsApp','Meeting','LinkedIn','Proposal','Note','Status Change','Other'];
const NEXT_TYPES = ['Call','Email','WhatsApp','Meeting','LinkedIn','Proposal','Follow-up','Research','Re-contact','Other'];
const CONTACT_TYPES = ['Call','Email','WhatsApp','Meeting','LinkedIn','Proposal'];
const REJECT_REASONS = ['Too expensive','Not interested','No budget','Wrong timing','Already has agency','Already has internal team','No decision maker','No response','Not a good fit','Competitor chosen','Service not required','Other'];
const SIZES = ['1–10','11–50','51–200','201–500','500+'];
const REMINDERS = ['None','Morning of','1 hour before','1 day before'];
const PRIORITIES = [['hot','Hot'],['warm','Warm'],['cold','Cold']];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DEFAULT_SETTINGS = {
  partners:[{id:'p1',name:'Partner 1'},{id:'p2',name:'Partner 2'},{id:'p3',name:'Partner 3'}],
  sources: DEFAULT_SOURCES.slice(),
  defaultTarget: 50,
  targets: {},
};
const LS_KEY = 'rps-growth-pipeline-v1';
const ROLES = [['partner','Partner'],['sales','Sales person'],['account_manager','Account manager'],['other','Other']];
const roleName = r => (ROLES.find(x=>x[0]===r)||[,'Team member'])[1];

/* ---------- Utils ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0');
const isoD = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoD(new Date());
const parseD = s => { const [y,m,d] = String(s).slice(0,10).split('-').map(Number); return new Date(y,(m||1)-1,d||1); };
const addDays = (s,n) => { const d = parseD(s); d.setDate(d.getDate()+n); return isoD(d); };
const diffDays = (a,b) => Math.round((parseD(a)-parseD(b))/864e5);
const monthOf = s => String(s||'').slice(0,7);
const thisMonth = () => today().slice(0,7);
const shiftMonth = (m,n) => { const [y,mo] = m.split('-').map(Number); const d = new Date(y,mo-1+n,1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const monthLabel = m => { if(!m) return ''; const [y,mo] = m.split('-').map(Number); return `${MONTHS[mo-1]} ${y}`; };
const monthShort = m => { const [y,mo] = m.split('-').map(Number); return MONTHS[mo-1].slice(0,3); };
const fmtD = s => { if(!s) return '—'; const d = parseD(s); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)} ${d.getFullYear()}`; };
const fmtLong = s => { const d = parseD(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const fmtShort = s => { const d = parseD(s); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; };
const fmtTime = iso => { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const nowLocalInput = () => { const d = new Date(); return `${isoD(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const money = n => (n || n===0) && n!=='' ? '£' + Number(n).toLocaleString('en-GB',{maximumFractionDigits:0}) : '—';
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
function relDue(s){
  if(!s) return 'No date';
  const d = diffDays(s, today());
  if(d===0) return 'Today'; if(d===1) return 'Tomorrow'; if(d===-1) return 'Yesterday';
  if(d<0) return `${-d} days ago`; if(d<7) return `In ${d} days`; return fmtShort(s);
}
const dueClass = s => !s ? '' : diffDays(s,today())<0 ? 'over' : diffDays(s,today())===0 ? 'today' : '';
const normCo = s => String(s||'').toLowerCase().replace(/&/g,' and ').replace(/\b(ltd|limited|llp|plc|inc|co|company|the|group|uk)\b/g,'').replace(/[^a-z0-9]/g,'');
const normWeb = s => String(s||'').toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/.*$/,'').trim();
const normPhone = s => { const d = String(s||'').replace(/\D/g,''); return d.length>=9 ? d.slice(-9) : ''; };
const normMail = s => String(s||'').trim().toLowerCase();
const waLink = s => { let d = String(s||'').replace(/\D/g,''); if(d.startsWith('0')) d = '44'+d.slice(1); return d ? 'https://wa.me/'+d : ''; };
const extUrl = s => !s ? '' : /^https?:\/\//i.test(s) ? s : 'https://'+s;

/* ---------- State ---------- */
const S = {
  mode:'local',            // 'db' (shared, persistent) or 'local' (this browser only)
  ready:false,
  cap:{},                  // resolved capability namespaces
  uid:null, isOwnerAdmin:false, auth:'unknown', email:'', authMsg:'', setup:null,
  leads:{}, settings:clone(DEFAULT_SETTINGS), members:{}, membersLoaded:false, leadsLoaded:false,
  localRole:{role:'admin',partnerId:'p1'},
  ui:{ pf:'all', chase:'mine', search:'', filters:{}, showFilters:false, sort:'due', dashMonth:thisMonth(), repMonth:thisMonth(), calMonth:thisMonth(),
       noteTab:{}, preview:null, skipSeat:false, navOpen:false },
  keep:{},                 // composer drafts that survive re-renders
  form:null,               // lead form draft
  importState:null,
  ai:{},                   // per-lead AI output
  sheet:null, pending:false,
};

/* ---------- Identity & permissions ---------- */
function me(){
  if(S.mode==='local') return S.localRole;
  const pid = S.members[S.uid]?.partnerId || null;
  return { role: S.isOwnerAdmin ? 'admin' : 'partner', partnerId: pid };
}
function isAdmin(){ return !S.ui.preview && me().role==='admin'; }
function myPid(){ return S.ui.preview || me().partnerId; }
function canEdit(l){ if(isAdmin()) return true; const p = myPid(); return !!p && (l.partnerId===p || l.backupPartnerId===p || l.accountManagerId===p); }
/* Team: stored under settings.partners for backward compatibility. Every member can own leads. */
function team(){ return (S.settings.partners||[]).map((m,i)=>({role:'partner',title:'',email:'',phone:'',active:true,color:i%8,shape:i%3,...m})); }
function activeTeam(){ return team().filter(m=>m.active!==false); }
function teamOpts(){ const order = ROLES.map(r=>r[0]); return activeTeam().sort((a,b)=>order.indexOf(a.role)-order.indexOf(b.role)).map(m=>[m.id, m.name+(m.role!=='partner'?' ('+roleName(m.role)+')':'')]); }
function partner(id){ return team().find(p=>p.id===id); }
function mcolor(id){ const m = partner(id); return m ? `var(--c${(+m.color||0)%8})` : 'var(--muted)'; }
function leadCount(id){ return allLeads().filter(l=>l.partnerId===id||l.backupPartnerId===id||l.accountManagerId===id).length; }
function pname(id){ return id ? (partner(id)?.name || 'Unknown') : 'Unassigned'; }
function byLabel(by){ return by==='admin' ? 'Admin' : by==='import' ? 'CSV import' : pname(by); }
function actor(){ return myPid() || 'admin'; }

/* ---------- Data layer (Supabase) ---------- */
// Each lead is one row: key columns (owner, backup, account manager, status) drive security rules;
// the full lead document (contacts, activities, notes) lives in the jsonb "data" column.
let sb = null, channel = null;
const leadRow = l => ({ id:l.id, data:clone(l), partner_id:l.partnerId||null, backup_partner_id:l.backupPartnerId||null, account_manager_id:l.accountManagerId||null, status:l.status, updated_at:new Date().toISOString() });
const DB = {
  async upsertLeads(list){ const { error } = await sb.from('leads').upsert(list.map(leadRow)); if(error) throw error; },
  async deleteLead(id){ const { error } = await sb.from('leads').delete().eq('id', id); if(error) throw error; },
  async deleteAll(){ const { error } = await sb.from('leads').delete().neq('id', ''); if(error) throw error; },
  async saveSettings(st){ const { error } = await sb.from('settings').upsert({ id:1, data:clone(st), updated_at:new Date().toISOString() }); if(error) throw error; },
  async updateProfile(userId, patch){ const { error } = await sb.from('profiles').update(patch).eq('user_id', userId); if(error) throw error; },
};
function persistLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({leads:S.leads,settings:S.settings,role:S.localRole})); }catch(e){} }
async function saveLead(l, msg){
  l.updatedAt = new Date().toISOString();
  S.leads[l.id] = l;
  if(msg) toast(msg);
  render();
  if(S.mode==='db'){ try{ await DB.upsertLeads([l]); } catch(e){ console.error(e); toast(writeErr(e), 'err'); } }
  else persistLocal();
}
async function deleteLead(id){
  delete S.leads[id];
  if(S.mode==='db'){ try{ await DB.deleteLead(id); }catch(e){ toast(writeErr(e),'err'); } }
  else persistLocal();
}
async function saveSettings(msg){
  if(msg) toast(msg);
  render();
  if(S.mode==='db'){ try{ await DB.saveSettings(S.settings); }catch(e){ console.error(e); toast(writeErr(e),'err'); } }
  else persistLocal();
}
async function bulkWrite(list){
  list.forEach(l=>S.leads[l.id]=l);
  if(S.mode!=='db'){ persistLocal(); return {ok:list.length, failed:0}; }
  let ok=0, failed=0;
  for(let i=0;i<list.length;i+=200){ const chunk = list.slice(i,i+200);
    try{ await DB.upsertLeads(chunk); ok += chunk.length; } catch(e){ console.error(e); failed += chunk.length; } }
  return {ok, failed};
}
function writeErr(e){
  const c = e?.code;
  if(c==='42501' || /row-level security|permission denied/i.test(e?.message||'')) return "Couldn't save: you don't have permission to change this.";
  if(/fetch|network/i.test(e?.message||'')) return "Couldn't save. Check your internet connection and try again.";
  if(c==='invalid_argument') return "Couldn't save: you have view-only access to this workspace.";
  if(c==='quota_exceeded') return "Couldn't save: storage is full. Delete old leads and try again.";
  if(c==='resource_exhausted') return 'Saving too quickly. Wait a moment and try again.';
  return "Couldn't save. Check your connection and try again.";
}

/* ---------- Derived ---------- */
const needsNext = l => !CLOSED.includes(l.status);
const isActive = l => !['converted','rejected','unresponsive'].includes(l.status);
const contact = l => (l.contacts||[])[0] || {};
function reached(l){ let r = ST[l.status]?.r || 0; (l.stageHistory||[]).forEach(h=>{ r = Math.max(r, ST[h.s]?.r||0); }); return r; }
function issues(l){
  if(!needsNext(l)) return [];
  const out = [];
  if(!l.partnerId) out.push('no assigned partner');
  if(!l.next || !l.next.text) out.push('no next action');
  if(!l.next || !l.next.due) out.push('no next follow-up date');
  return out;
}
function bucket(l){
  if(!needsNext(l)) return null;
  if(!l.next || !l.next.due || !l.next.text) return 'none';
  const d = diffDays(l.next.due, today());
  if(l.status==='notnow' && d>7) return 'parked';
  if(d<0) return 'overdue'; if(d===0) return 'today'; if(d===1) return 'tomorrow'; if(d<=7) return 'week'; return 'upcoming';
}
function allLeads(){ return Object.values(S.leads); }
// Every lead is visible to the whole team. The top-bar filter narrows the view.
const isMine = (l,p) => !!p && (l.partnerId===p || l.backupPartnerId===p || l.accountManagerId===p);
function scoped(){
  let L = allLeads();
  if(S.ui.pf==='none') L = L.filter(l=>!l.partnerId);
  else if(S.ui.pf==='mine') L = L.filter(l=>isMine(l,myPid()));
  else if(S.ui.pf!=='all') L = L.filter(l=>l.partnerId===S.ui.pf);
  return L;
}
// Chase lists (dashboard actions, follow-ups, calendar) default to your own leads.
function chaseScoped(){ const L = scoped(), p = myPid(); return (S.ui.chase==='all' || !p) ? L : L.filter(l=>isMine(l,p)); }
function chaseToggle(){ if(!myPid()) return ''; return `<div class="tabs" role="group" aria-label="Whose actions to show"><button class="${S.ui.chase!=='all'?'on':''}" data-a="chase" data-v="mine" aria-pressed="${S.ui.chase!=='all'}">Mine</button><button class="${S.ui.chase==='all'?'on':''}" data-a="chase" data-v="all" aria-pressed="${S.ui.chase==='all'}">Everyone</button></div>`; }
function funnelFor(L){ return FUNNEL.map(([label,r])=>[label, r===0 ? L.length : L.filter(l=>reached(l)>=r).length]); }
function statsFor(L){
  return { leads:L.length, active:L.filter(isActive).length, contacted:L.filter(l=>reached(l)>=2).length, meetings:L.filter(l=>reached(l)>=3).length,
    qualified:L.filter(l=>reached(l)>=4).length, proposals:L.filter(l=>reached(l)>=5).length, converted:L.filter(l=>l.status==='converted').length,
    rejected:L.filter(l=>l.status==='rejected').length, overdue:L.filter(l=>bucket(l)==='overdue').length, value:L.filter(l=>l.status==='converted').reduce((a,l)=>a+(+l.conversion?.value||0),0) };
}
function monthsAvailable(){
  const set = new Set(allLeads().map(l=>l.month).filter(Boolean)); set.add(thisMonth());
  for(let i=1;i<=2;i++) set.add(shiftMonth(thisMonth(),-i));
  set.add(shiftMonth(thisMonth(),1));
  return [...set].sort().reverse();
}
function targetFor(m){ return +(S.settings.targets?.[m] ?? S.settings.defaultTarget ?? 50); }

const FILTER_DEFS = () => [
  ['partner','Assigned to',[['none','Unassigned'],...teamOpts()]],
  ['am','Account manager',[['none','None'],...teamOpts()]],
  ['status','Status',STAGES.map(s=>[s.k,s.l])],
  ['state','Converted / active / lost',[['active','Active'],['converted','Converted'],['lost','Lost (rejected)'],['parked','Not now'],['unresponsive','Unresponsive']]],
  ['industry','Industry',INDUSTRIES],
  ['location','Location',[...new Set(allLeads().map(l=>l.location).filter(Boolean))].sort()],
  ['source','Lead source',S.settings.sources],
  ['priority','Priority',PRIORITIES],
  ['month','Month added',monthsAvailable().map(m=>[m,monthLabel(m)])],
  ['due','Due date',[['overdue','Overdue'],['today','Due today'],['week','Next 7 days'],['none','No follow-up set']]],
  ['score','Lead score',[['75','75 and above'],['50','50 to 74'],['0','Below 50']]],
  ['service','Potential service',SERVICES],
];
function matchSearch(l,q){
  if(!q) return true; q = q.toLowerCase();
  const hay = [l.company,l.website,l.location,...(l.contacts||[]).flatMap(c=>[c.name,c.email,c.phone,c.whatsapp])].join(' ').toLowerCase();
  if(hay.includes(q)) return true;
  const d = q.replace(/\D/g,''); return d.length>=4 && (l.contacts||[]).some(c=>(String(c.phone)+String(c.whatsapp)).replace(/\D/g,'').includes(d));
}
function filteredLeads(){
  const f = S.ui.filters, q = S.ui.search.trim();
  let L = scoped().filter(l=>matchSearch(l,q));
  if(f.partner) L = L.filter(l=> f.partner==='none' ? !l.partnerId : l.partnerId===f.partner);
  if(f.am) L = L.filter(l=> f.am==='none' ? !l.accountManagerId : l.accountManagerId===f.am);
  if(f.status) L = L.filter(l=>l.status===f.status);
  if(f.state) L = L.filter(l=>({active:isActive(l)&&l.status!=='notnow',converted:l.status==='converted',lost:l.status==='rejected',parked:l.status==='notnow',unresponsive:l.status==='unresponsive'})[f.state]);
  ['industry','location','source','priority','month'].forEach(k=>{ if(f[k]) L = L.filter(l=>l[k]===f[k]); });
  if(f.due) L = L.filter(l=>{ const b = bucket(l); return f.due==='week' ? ['today','tomorrow','week'].includes(b) : b===f.due; });
  if(f.score) L = L.filter(l=> f.score==='75' ? l.score>=75 : f.score==='50' ? l.score>=50&&l.score<75 : l.score<50);
  if(f.service) L = L.filter(l=>(l.services||[]).includes(f.service));
  const sorters = {
    due:(a,b)=>(a.next?.due||'9999').localeCompare(b.next?.due||'9999'),
    added:(a,b)=>b.addedAt.localeCompare(a.addedAt), score:(a,b)=>(b.score||0)-(a.score||0), company:(a,b)=>a.company.localeCompare(b.company),
  };
  return L.sort(sorters[S.ui.sort]||sorters.due);
}

    box.innerHTML = scoped().length ? empty('No leads match', 'Try a different search or clear the filters.', `<button class="btn" data-a="clearfilters">Clear filters</button>`)
      : empty(S.ui.pf==='mine'?'No leads assigned to you.':'Add your first prospect', S.ui.pf==='mine'?'Switch the filter to Everyone to see the whole team\'s leads.':'Leads you or your team add will appear here.', `<a class="btn pri" href="#/new">${ic('plus',17)} Add lead</a>`);
    return;
  }
  const rows = L.map(l=>{ const c = contact(l); const iss = issues(l); return `<tr data-a="open" data-id="${l.id}">
    <td><div class="co">${esc(l.company)}</div><div class="sub">${esc(l.location||'')}</div></td>
    <td>${esc(c.name||'—')}<div class="sub">${esc(c.title||'')}</div></td>
    <td>${pchip(l.partnerId)}</td><td>${esc(l.industry||'—')}</td><td>${stChip(l.status)}</td><td>${prChip(l.priority)}</td><td>${scoreEl(l.score)}</td>
    <td class="nx">${l.next?.text ? esc(l.next.type+': '+l.next.text) : (iss.length?`<span class="chip amber">${ic('alert',12)} Not set</span>`:'<span class="muted">—</span>')}</td>
    <td>${l.next?.due ? dueEl(l.next.due) : '—'}</td><td class="sub">${l.lastContacted?fmtShort(l.lastContacted):'—'}</td><td class="sub">${fmtShort(l.addedAt)}</td></tr>`; }).join('');
  const cards = L.map(l=>{ const c = contact(l); return `<div class="lcard ${l.next?.due?dueClass(l.next.due):''}" data-a="open" data-id="${l.id}" role="link" tabindex="0">
    <div class="row between"><b>${esc(l.company)}</b>${prChip(l.priority)}</div>
    <div class="small muted">${esc(c.name||'No contact')}${c.title?', '+esc(c.title):''}</div>
    <div class="row wrap mt8">${stChip(l.status)}${pchip(l.partnerId)}${scoreEl(l.score)}</div>
    <div class="row between mt8 small"><span class="grow" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l.next?.text?esc(l.next.type+': '+l.next.text):'<span style="color:var(--amber)">No next action</span>'}</span>${l.next?.due?dueEl(l.next.due):''}</div></div>`; }).join('');
  box.innerHTML = `<div class="tbl-wrap leads-tbl"><table class="tbl"><thead><tr><th>Company</th><th>Contact</th><th>Owner</th><th>Industry</th><th>Status</th><th>Priority</th><th>Lead score</th><th>Next action</th><th>Due date</th><th>Last contacted</th><th>Added</th></tr></thead><tbody>${rows}</tbody></table></div><div class="lcards">${cards}</div>`;
}

/* ---------- Lead detail ---------- */
function leadView(r){
  if(r.sub==='edit') return formView(r.id);
  const l = S.leads[r.id];
  if(!l) return empty('Lead not found', 'It may have been deleted or you may not have access.', `<a class="btn" href="#/leads">Back to leads</a>`);
  const c = contact(l), ed = canEdit(l), iss = issues(l);
  const nd = l.next?.due ? dueClass(l.next.due) : '';
  const acts = [...(l.activities||[])].sort((a,b)=>b.at.localeCompare(a.at));
  const tab = S.ui.noteTab[l.id] || 'internal';
  const notes = (l.notes||[]).filter(n=>n.kind===tab).sort((a,b)=>b.at.localeCompare(a.at));
  const k = S.keep;
  const qa = [
    c.phone ? `<a class="btn sm" href="tel:${esc(c.phone.replace(/\s/g,''))}" data-a="qa" data-t="Call" data-id="${l.id}">${ic('phone',16)} Call</a>` : '',
    c.email ? `<a class="btn sm" href="mailto:${esc(c.email)}" data-a="qa" data-t="Email" data-id="${l.id}">${ic('mail',16)} Email</a>` : '',
    (c.whatsapp||c.phone) ? `<a class="btn sm" href="${esc(waLink(c.whatsapp||c.phone))}" target="_blank" rel="noopener" data-a="qa" data-t="WhatsApp" data-id="${l.id}">${ic('chat',16)} WhatsApp</a>` : '',
    c.linkedin ? `<a class="btn sm" href="${esc(extUrl(c.linkedin))}" target="_blank" rel="noopener" data-a="qa" data-t="LinkedIn" data-id="${l.id}">${ic('li',16)} LinkedIn</a>` : '',
    ed ? `<button class="btn sm" data-a="focus" data-f="note-${l.id}">${ic('note',16)} Add note</button>` : '',
    ed ? `<button class="btn sm" data-a="focus" data-f="act-${l.id}">${ic('plus',16)} Add activity</button>` : '',
    ed ? `<button class="btn sm" data-a="editnext" data-id="${l.id}">${ic('cal',16)} Schedule follow-up</button>` : '',
    ed ? `<button class="btn sm" data-a="stagesheet" data-id="${l.id}">${ic('pipe',16)} Change status</button>` : '',
    isAdmin() ? `<button class="btn sm" data-a="owner" data-id="${l.id}">${ic('swap',16)} Assign owner</button>` : '',
  ].join('');
  const statusBanner = l.status==='converted' && l.conversion ? `<div class="banner green"><b>Converted ${fmtD(l.conversion.date)}</b> for ${money(l.conversion.value)}/month. Services sold: ${esc((l.conversion.services||[]).join(', ')||'—')}</div>`
    : l.status==='rejected' && l.rejection ? `<div class="banner red"><b>Rejected:</b> ${esc(l.rejection.reason)}${l.rejection.notes?'. '+esc(l.rejection.notes):''}</div>`
    : l.status==='notnow' && l.notNow ? `<div class="banner grey"><b>Not now.</b> ${esc(l.notNow.reason)} Re-contact on <b>${fmtD(l.notNow.recontact)}</b>. It returns to ${esc(pname(l.partnerId))}'s follow-ups automatically.</div>`
    : l.status==='unresponsive' ? `<div class="banner grey"><b>Unresponsive.</b> Move it back into the pipeline if they get in touch.</div>` : '';
  const nextBlock = needsNext(l) && (!l.next || !l.next.due || !l.next.text) ? `
      <div class="alertbox"><b>${ic('alert',18)} Action required</b><p>This lead has ${esc(iss.filter(x=>x!=='no assigned partner').join(' and ')||'no next action')}.${!l.partnerId?' It also has no owner.':''}</p>
      ${ed?`<button class="btn pri" data-a="editnext" data-id="${l.id}">${ic('cal',16)} Schedule follow-up</button>`:''}</div>`
    : l.next ? `<section class="card next ${nd}"><div class="row between"><span class="lbl">Next action${nd==='over'?', overdue':nd==='today'?', due today':''}</span><span class="chip">${esc(l.next.type)}</span></div>
      <div class="what">${esc(l.next.text)}</div>
      <div class="small muted">Due <b style="color:var(--ink)">${fmtD(l.next.due)}</b> (${esc(relDue(l.next.due))})${l.next.reminder&&l.next.reminder!=='None'?`. Reminder: ${esc(l.next.reminder)}`:''}</div>
      ${ed?`<div class="row wrap mt12"><button class="btn pri" data-a="complete" data-id="${l.id}">${ic('check',16)} Complete action</button><button class="btn" data-a="resched" data-id="${l.id}">Reschedule</button><button class="btn ghost" data-a="editnext" data-id="${l.id}">${ic('edit',16)} Edit</button></div>`:''}
      ${!l.partnerId?`<p class="small mt12" style="color:var(--amber)">${ic('alert',14)} No owner assigned yet.</p>`:''}</section>`
    : `<section class="card"><p class="muted small">No next action needed for a ${esc(ST[l.status].l.toLowerCase())} lead.</p>${ed?`<button class="btn sm mt8" data-a="editnext" data-id="${l.id}">Schedule a follow-up anyway</button>`:''}</section>`;
  const otherContacts = (l.contacts||[]).slice(1);

  <div class="lead-h"><div class="grow">
    <h1>${esc(l.company)}</h1>
    <div class="small muted mt8">${[l.industry,l.location,l.size?l.size+' staff':''].filter(Boolean).map(esc).join(', ')}${l.website?` <a href="${esc(extUrl(l.website))}" target="_blank" rel="noopener" style="margin-left:6px">${esc(normWeb(l.website))}</a>`:''}</div>
    <div class="lead-meta">
      ${ed?`<select class="input" data-c="status" data-id="${l.id}" aria-label="Status">${stageOpts(l.status)}</select>`:stChip(l.status)}
      ${ed?`<select class="input" data-c="priority" data-id="${l.id}" aria-label="Priority">${opts(PRIORITIES,l.priority)}</select>`:prChip(l.priority)}
      ${isAdmin()?`<select class="input" data-c="assign" data-id="${l.id}" aria-label="Assigned to">${partnerOpts(l.partnerId)}</select>`:pchip(l.partnerId)}
      ${scoreEl(l.score)}
    </div></div>
    <div class="row">${ed?`<a class="btn" href="#/lead/${l.id}/edit">${ic('edit',16)} Edit</a>`:''}${isAdmin()?`<button class="btn danger icon" data-a="delete" data-id="${l.id}" aria-label="Delete lead">${ic('trash',17)}</button>`:''}</div>
  </div>
  <div class="qa">${qa}</div>
  ${statusBanner}
  ${!ed ? `<div class="banner grey">${ic('user',15)} Owned by <b>${esc(pname(l.partnerId))}</b>. You can view everything; changes are made by the owner, backup owner, account manager or an admin.</div>` : ''}
  <div class="ldgrid">
    <div class="stack">
      ${nextBlock}
      <section class="card"><div class="card-h"><h2>Activity</h2><span class="tiny muted">${acts.length} logged</span></div>
        ${ed?`<div class="composer"><select class="input" data-keep="acttype-${l.id}" aria-label="Activity type">${opts(ACT_TYPES.filter(t=>t!=='Status Change'), k['acttype-'+l.id]||'Call')}</select>
          <input class="input" type="datetime-local" data-keep="actat-${l.id}" value="${esc(k['actat-'+l.id]||nowLocalInput())}" aria-label="When">
          <textarea class="input" id="act-${l.id}" data-keep="act-${l.id}" placeholder="What happened? e.g. Spoke with ${esc((c.name||'them').split(' ')[0])}, wants pricing for social management.">${esc(k['act-'+l.id]||'')}</textarea>
          <div class="row"><button class="btn pri sm" data-a="addact" data-id="${l.id}">Add activity</button></div></div>`:''}
        <div class="timeline mt12">${acts.length ? acts.map(a=>`<div class="tl"><div class="d"><b>${fmtShort(a.at)}</b>${fmtTime(a.at)}</div><div class="dot"><i style="border-color:${a.type==='Status Change'?'var(--muted)':a.type==='Meeting'?'var(--violet)':a.type==='Proposal'?'var(--amber)':'var(--accent)'}"></i></div>
          <div class="body"><div class="h"><span class="chip">${esc(a.type)}</span><span>${esc(byLabel(a.by))}</span></div><p>${esc(a.text)}</p></div></div>`).join('') : empty('No activity yet','Log your first call, email or message above.')}</div>
      </section>
      <section class="card"><div class="card-h"><h2>Notes</h2><div class="tabs" role="tablist"><button class="${tab==='internal'?'on':''}" data-a="notetab" data-id="${l.id}" data-t="internal">Internal</button><button class="${tab==='meeting'?'on':''}" data-a="notetab" data-id="${l.id}" data-t="meeting">Meeting notes</button></div></div>
        ${ed?`<textarea class="input" id="note-${l.id}" data-keep="note-${l.id}" placeholder="${tab==='meeting'?'Who attended, pain points, budget, next steps…':'Add an internal note for the team…'}">${esc(k['note-'+l.id]||'')}</textarea><div class="row mt8" style="justify-content:flex-end"><button class="btn sm pri" data-a="addnote" data-id="${l.id}" data-t="${tab}">Add ${tab==='meeting'?'meeting note':'note'}</button></div>`:''}
        <div class="stack mt12" style="gap:8px">${notes.length?notes.map(n=>`<div class="note"><div class="tiny muted">${fmtD(n.at)} at ${fmtTime(n.at)}, ${esc(byLabel(n.by))}</div><p>${esc(n.text)}</p></div>`).join(''):`<p class="small muted">No ${tab==='meeting'?'meeting notes':'internal notes'} yet.</p>`}</div>
      </section>
    </div>
    <div class="stack">
      <section class="card"><div class="card-h"><h2>Contact</h2></div>
        <div class="contact-name">${esc(c.name||'No contact yet')}</div><div class="small muted">${esc(c.title||'')}</div>
        <dl class="kv mt12">
          <dt>Phone</dt><dd>${c.phone?`<a href="tel:${esc(c.phone.replace(/\s/g,''))}">${esc(c.phone)}</a>`:'—'}</dd>
          <dt>Email</dt><dd>${c.email?`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`:'—'}</dd>
          <dt>WhatsApp</dt><dd>${c.whatsapp?`<a href="${esc(waLink(c.whatsapp))}" target="_blank" rel="noopener">${esc(c.whatsapp)}</a>`:'—'}</dd>
          <dt>LinkedIn</dt><dd>${c.linkedin?`<a href="${esc(extUrl(c.linkedin))}" target="_blank" rel="noopener">Profile</a>`:'—'}</dd>
        </dl>
        ${otherContacts.length?`<div class="mt16"><h3 class="small">Other contacts</h3>${otherContacts.map(o=>`<div class="note mt8"><b>${esc(o.name)}</b> <span class="small muted">${esc(o.title||'')}</span><div class="small">${[o.email,o.phone].filter(Boolean).map(esc).join(', ')}</div></div>`).join('')}</div>`:''}
      </section>
      <section class="card"><div class="card-h"><h2>Opportunity</h2></div>
        <div class="svc">${(l.services||[]).map(s=>`<span class="chip blue">${esc(s)}</span>`).join('')||'<span class="small muted">No services selected</span>'}</div>
        <dl class="kv mt16">
          <dt>Lead score</dt><dd>${scoreEl(l.score)}</dd>
          <dt>Est. monthly value</dt><dd>${money(l.value)}</dd>
          <dt>Probability</dt><dd>${l.probability!=null&&l.probability!==''?l.probability+'%':'—'}</dd>
          <dt>Weighted value</dt><dd>${l.value&&l.probability?money(l.value*l.probability/100):'—'}</dd>
          <dt>Expected close</dt><dd>${fmtD(l.expectedClose)}</dd>
          ${l.meetingDate?`<dt>Meeting</dt><dd>${fmtD(l.meetingDate)}</dd>`:''}
          ${l.proposalDate?`<dt>Proposal sent</dt><dd>${fmtD(l.proposalDate)}</dd>`:''}
        </dl>
      </section>
      ${aiCard(l)}
      <section class="card"><div class="card-h"><h2>Company</h2></div>
        <dl class="kv">
          <dt>Lead source</dt><dd>${esc(l.source||'—')}</dd>
          <dt>Added</dt><dd>${fmtD(l.addedAt)}</dd>
          <dt>Prospecting month</dt><dd>${esc(monthLabel(l.month))}</dd>
          <dt>Created by</dt><dd>${esc(byLabel(l.createdBy))}</dd>
          <dt>Backup owner</dt><dd>${esc(l.backupPartnerId?pname(l.backupPartnerId):'—')}</dd>
          <dt>Account manager</dt><dd>${l.accountManagerId?pchip(l.accountManagerId):'—'}</dd>
          <dt>Last contacted</dt><dd>${fmtD(l.lastContacted)}</dd>
          ${l.socials?.linkedin?`<dt>LinkedIn</dt><dd><a href="${esc(extUrl(l.socials.linkedin))}" target="_blank" rel="noopener">Company page</a></dd>`:''}
          ${l.socials?.instagram?`<dt>Instagram</dt><dd><a href="https://instagram.com/${esc(l.socials.instagram.replace(/^@|.*instagram\.com\//g,''))}" target="_blank" rel="noopener">${esc(l.socials.instagram)}</a></dd>`:''}
          ${l.socials?.facebook?`<dt>Facebook</dt><dd><a href="${esc(extUrl(l.socials.facebook))}" target="_blank" rel="noopener">Page</a></dd>`:''}
          ${l.socials?.other?`<dt>Other</dt><dd>${esc(l.socials.other)}</dd>`:''}
        </dl>
      </section>
    </div>
  </div>`;
}

/* ---------- Lead form ---------- */
function blankLead(){
  const p = myPid();
  return { id:null, company:'', website:'', industry:'', location:'', size:'', socials:{linkedin:'',instagram:'',facebook:'',other:''},
    contacts:[{id:uid('c'),name:'',title:'',email:'',phone:'',whatsapp:'',linkedin:''}], addedAt:today(), month:thisMonth(), source:'', createdBy:actor(),
    partnerId:p||'', backupPartnerId:'', priority:'warm', score:50, services:[], value:'', probability:20, expectedClose:'', status:'new',
    next:{type:'Research',text:'Research and make first contact',due:addDays(today(),1),reminder:'Morning of'}, activities:[], notes:[], stageHistory:[], firstNote:'' };
}
function formView(id){
  const key = id || 'new';
  if(!S.form || S.form.key!==key){ const src = id ? S.leads[id] : null; if(id && !src) return empty('Lead not found','',''); S.form = {key, draft: src ? clone(src) : blankLead(), dups:null, errors:{}}; }
  const d = S.form.draft, e = S.form.errors, isNew = !id;
  if(id && !canEdit(S.leads[id])) return empty('You can only edit leads assigned to you','','');
  const fld = (name,label,val,type='text',extra='') => `<label class="f ${extra.includes('required')?'req':''}">${label}<input class="input" name="${name}" type="${type}" value="${esc(val??'')}" ${extra}>${e[name]?`<span class="hint" style="color:var(--red)">${esc(e[name])}</span>`:''}</label>`;
  const sel = (name,label,list,val,blank) => `<label class="f">${label}<select class="input" name="${name}">${opts(list,val,blank)}</select></label>`;
  const dupHtml = S.form.dups?.length ? `<div class="dup" role="alert"><b class="t">Possible duplicate found</b><p class="small" style="color:var(--ink-2)">These existing leads share a company name, website, email or phone.</p>
    ${S.form.dups.map(x=>`<div class="dupitem"><div><b>${esc(x.l.company)}</b><div class="small muted">${esc(contact(x.l).name||'')}, ${esc(pname(x.l.partnerId))}, ${esc(ST[x.l.status].l)}. Matched on ${esc(x.why.join(', '))}</div></div><a class="btn sm" href="#/lead/${x.l.id}" data-a="viewdup">View existing</a></div>`).join('')}
    <div class="row mt12" style="justify-content:flex-end"><button class="btn" type="button" data-a="createanyway">Create anyway</button></div></div>` : '';
  return `
  <a href="${isNew?'#/leads':'#/lead/'+id}" class="btn ghost sm" style="margin:-6px 0 8px -8px">${ic('back',16)} ${isNew?'Leads':'Back to lead'}</a>
  <div class="page-h"><div><h1>${isNew?'Add lead':'Edit '+esc(d.company)}</h1><p>Every active lead needs an owner, a status, a next action and a due date.</p></div></div>
  ${dupHtml}
  <form id="leadForm" data-form="lead" novalidate>
    <section class="card fsect"><h2>Company</h2><div class="grid3">

      ${fld('website','Website',d.website,'text','placeholder="www.example.co.uk"')}
      ${sel('industry','Industry',INDUSTRIES,d.industry,'Select industry')}
      ${fld('location','Location',d.location,'text','placeholder="Croydon"')}
      ${sel('size','Company size',SIZES.map(s=>[s,s+' staff']),d.size,'Unknown')}
      ${fld('s_linkedin','Company LinkedIn',d.socials?.linkedin)}
      ${fld('s_instagram','Instagram',d.socials?.instagram,'text','placeholder="@handle"')}
      ${fld('s_facebook','Facebook',d.socials?.facebook)}
      ${fld('s_other','Other social links',d.socials?.other,'text','placeholder="TikTok, X, YouTube…"')}
    </div></section>
    <section class="card fsect"><div class="card-h" style="margin-bottom:10px"><h2>Contacts</h2><button class="btn sm" type="button" data-a="addcontact">${ic('plus',15)} Add another contact</button></div>
      ${d.contacts.map((c,i)=>`<div class="contact-block"><div class="row between" style="margin-bottom:10px"><b class="small">${i===0?'Primary contact':'Contact '+(i+1)}</b>${i>0?`<button class="btn sm ghost" type="button" data-a="rmcontact" data-i="${i}">Remove</button>`:''}</div><div class="grid3">
        ${fld('c_name_'+i,'Contact name',c.name)}${fld('c_title_'+i,'Job title',c.title)}${fld('c_email_'+i,'Email',c.email,'email')}
        ${fld('c_phone_'+i,'Phone',c.phone,'tel')}${fld('c_whatsapp_'+i,'WhatsApp',c.whatsapp,'tel')}${fld('c_linkedin_'+i,'LinkedIn',c.linkedin)}</div></div>`).join('')}
    </section>
    <section class="card fsect"><h2>Lead</h2><div class="grid3">
      ${fld('addedAt','Date added',d.addedAt,'date')}
      ${fld('month','Prospecting month',d.month,'month')}
      ${sel('source','Lead source',S.settings.sources,d.source,'Select source')}
      ${isAdmin()?`<label class="f">Assigned to<select class="input" name="partnerId">${partnerOpts(d.partnerId)}</select></label>`:`<label class="f">Assigned to<input class="input" value="${esc(pname(d.partnerId||myPid()))}" disabled></label>`}
      <label class="f">Backup owner<select class="input" name="backupPartnerId">${partnerOpts(d.backupPartnerId,'None')}</select></label>
      <label class="f">Account manager<select class="input" name="accountManagerId">${partnerOpts(d.accountManagerId,'None')}</select></label>
      ${sel('status','Status',STAGES.filter(s=>isNew?!['converted','rejected','notnow'].includes(s.k):true).map(s=>[s.k,s.l]),d.status)}
      ${sel('priority','Priority',PRIORITIES,d.priority)}
      ${fld('score','Lead score (0–100)',d.score,'number','min="0" max="100"')}
      ${fld('value','Est. monthly value (£)',d.value,'number','min="0" step="50"')}
      ${fld('probability','Probability (%)',d.probability,'number','min="0" max="100"')}
      ${fld('expectedClose','Expected close date',d.expectedClose,'date')}
      <label class="f">Created by<input class="input" value="${esc(byLabel(d.createdBy))}" disabled></label>
    </div>
    <div class="mt16"><span class="small strong" style="color:var(--ink-2)">Potential services</span><div class="svc mt8">${SERVICES.map(s=>`<label class="chip toggle-chip"><input type="checkbox" name="services" value="${esc(s)}" ${d.services.includes(s)?'checked':''}>${esc(s)}</label>`).join('')}</div></div>
    </section>
    <section class="card fsect"><h2>Next action</h2><div class="grid3">
      ${sel('n_type','Action type',NEXT_TYPES,d.next?.type||'Call')}
      ${fld('n_text','Description',d.next?.text,'text','placeholder="e.g. Call John to discuss proposal"')}
      ${fld('n_due','Due date',d.next?.due,'date')}
      ${sel('n_reminder','Reminder',REMINDERS,d.next?.reminder||'Morning of')}
    </div></section>
    ${isNew?`<section class="card fsect"><h2>First notes</h2><textarea class="input" name="firstNote" style="min-height:130px" placeholder="What caught your eye? Social presence, pain points, who referred them…">${esc(d.firstNote||'')}</textarea></section>`:''}
    <div class="formbar"><a class="btn" href="${isNew?'#/leads':'#/lead/'+id}" data-a="cancelform">Cancel</a><button class="btn pri" type="submit">${ic('check',16)} ${isNew?'Save lead':'Save changes'}</button></div>
  </form>`;
}
function collectForm(){
  const f = $('#leadForm'); if(!f) return S.form?.draft;
  const fd = new FormData(f), g = k => (fd.get(k)??'').toString().trim(), d = S.form.draft;
  Object.assign(d, {company:g('company'),website:g('website'),industry:g('industry'),location:g('location'),size:g('size'),
    socials:{linkedin:g('s_linkedin'),instagram:g('s_instagram'),facebook:g('s_facebook'),other:g('s_other')},
    addedAt:g('addedAt')||today(), month:g('month')||monthOf(g('addedAt')||today()), source:g('source'), backupPartnerId:g('backupPartnerId')||null, accountManagerId:g('accountManagerId')||null,
    status:g('status')||'new', priority:g('priority')||'warm', score:g('score')===''?'':Math.max(0,Math.min(100,+g('score'))), value:g('value')===''?'':+g('value'),
    probability:g('probability')===''?'':Math.max(0,Math.min(100,+g('probability'))), expectedClose:g('expectedClose'), services:fd.getAll('services').map(String),
    next:{type:g('n_type'),text:g('n_text'),due:g('n_due'),reminder:g('n_reminder')}, firstNote:g('firstNote') });
  if(isAdmin()) d.partnerId = g('partnerId')||null; else if(!d.partnerId) d.partnerId = myPid();
  d.contacts = d.contacts.map((c,i)=>({id:c.id||uid('c'),name:g('c_name_'+i),title:g('c_title_'+i),email:g('c_email_'+i),phone:g('c_phone_'+i),whatsapp:g('c_whatsapp_'+i),linkedin:g('c_linkedin_'+i)}));
  return d;
}
function findDuplicates(d, exceptId){
  const co = normCo(d.company), web = normWeb(d.website), mails = (d.contacts||[]).map(c=>normMail(c.email)).filter(Boolean), phones = (d.contacts||[]).flatMap(c=>[normPhone(c.phone),normPhone(c.whatsapp)]).filter(Boolean);
  const out = [];
  allLeads().forEach(l=>{ if(l.id===exceptId) return; const why = [];
    if(co && co.length>2 && normCo(l.company)===co) why.push('company name');
    if(web && normWeb(l.website)===web) why.push('website');
    if(mails.length && (l.contacts||[]).some(c=>mails.includes(normMail(c.email)))) why.push('email');
    if(phones.length && (l.contacts||[]).some(c=>phones.includes(normPhone(c.phone))||phones.includes(normPhone(c.whatsapp)))) why.push('phone');
    if(why.length) out.push({l,why}); });
  return out;
}
function submitLeadForm(force){
  const d = collectForm(), e = {};
  if(!d.company) e.company = 'Company name is required.';
  if(needsNext(d)){ if(!d.next.text) e.n_text = 'Add the next action so this lead is not forgotten.'; if(!d.next.due) e.n_due = 'Pick a due date.'; }
  S.form.errors = e;
  if(Object.keys(e).length){ render(); toast('Fill in the highlighted fields.','err'); const first = Object.keys(e)[0]; setTimeout(()=>$(`[name="${first}"]`)?.focus(),30); return; }
  const isNew = !d.id;
  if(isNew && !force){ const dups = findDuplicates(d); if(dups.length){ S.form.dups = dups; render(); window.scrollTo(0,0); return; } }
  const l = clone(d); const fn = l.firstNote; delete l.firstNote;
  if(!needsNext(l) && !l.next?.text) l.next = null;
  if(isNew){
    l.id = 'L'+Date.now().toString(36).toUpperCase(); l.createdBy = actor();
    l.stageHistory = [{s:'new',at:new Date().toISOString()}]; if(l.status!=='new') l.stageHistory.push({s:l.status,at:new Date().toISOString()});
    l.activities = [{id:uid('a'),at:new Date().toISOString(),by:actor(),type:'Note',text:`Lead created${l.source?' from '+l.source:''}.`}];
    l.notes = fn ? [{id:uid('n'),at:new Date().toISOString(),by:actor(),kind:'internal',text:fn}] : [];
  } else {
    const prev = S.leads[l.id];
    if(prev && prev.status!==l.status){ l.stageHistory = [...(l.stageHistory||[]),{s:l.status,at:new Date().toISOString()}]; l.activities.push({id:uid('a'),at:new Date().toISOString(),by:actor(),type:'Status Change',text:`Moved from ${ST[prev.status].l} to ${ST[l.status].l}.`}); }
    if(prev && prev.partnerId!==l.partnerId) l.activities.push({id:uid('a'),at:new Date().toISOString(),by:actor(),type:'Other',text:`Assigned to ${pname(l.partnerId)}.`});
  }
  S.form = null;
  location.hash = '/lead/'+l.id;
  saveLead(l, isNew ? (l.partnerId ? `Lead added and assigned to ${pname(l.partnerId)}.` : 'Lead added. Assign an owner next.') : 'Changes saved.');
}

/* ---------- Stage changes ---------- */
function requestStage(id, stage){
  const l = S.leads[id]; if(!l || l.status===stage) return;
  if(!canEdit(l)) return toast('You can only update leads assigned to you.','err');
  const T = today(), name = ST[stage].l, c = contact(l);
  const forms = {
    meeting:()=>`<label class="f req">Meeting date<input class="input" type="date" name="date" value="${addDays(T,2)}" required></label><label class="f">Meeting time<input class="input" type="time" name="time" value="10:00"></label><label class="f">Notes<input class="input" name="notes" placeholder="Video call, at their office…"></label>`,
    proposal:()=>`<label class="f req">Proposal date<input class="input" type="date" name="date" value="${T}" required></label><label class="f">Proposal value (£/month)<input class="input" type="number" name="value" value="${esc(l.value||'')}"></label><label class="f">Chase on<input class="input" type="date" name="chase" value="${addDays(T,3)}"></label>`,
    converted:()=>`<label class="f">Account manager<select class="input" name="am">${partnerOpts(l.accountManagerId || activeTeam().find(m=>m.role==='account_manager')?.id || '', 'None yet')}</select></label><label class="f req">Conversion date<input class="input" type="date" name="date" value="${T}" required></label><label class="f req">Final value (£/month)<input class="input" type="number" name="value" value="${esc(l.value||'')}" required></label><div><span class="small strong">Services sold</span><div class="svc mt8">${SERVICES.map(s=>`<label class="chip toggle-chip"><input type="checkbox" name="services" value="${esc(s)}" ${(l.services||[]).includes(s)?'checked':''}>${esc(s)}</label>`).join('')}</div></div>`,
    rejected:()=>`<label class="f req">Rejection reason<select class="input" name="reason" required>${opts(REJECT_REASONS,'','Select a reason')}</select></label><label class="f">Notes (optional)<textarea class="input" name="notes" placeholder="Anything that would help if we try again later"></textarea></label>`,
    notnow:()=>`<label class="f req">Reason<input class="input" name="reason" required placeholder="e.g. Asked us to call back after January"></label><label class="f req">Re-contact date<input class="input" type="date" name="date" value="${addDays(T,90)}" required></label><div class="quickdates">${[['1 month',30],['3 months',90],['6 months',182]].map(([l2,n])=>`<button type="button" class="btn sm" data-a="setdate" data-v="${addDays(T,n)}">${l2}</button>`).join('')}</div>`,
  };
  if(!forms[stage]) return applyStage(id, stage, {});
  openSheet(`<h2>Move to ${esc(name)}</h2><p class="sub">${esc(l.company)}${c.name?', '+esc(c.name):''}</p><div class="stack">${forms[stage]()}</div>`, `Move to ${name}`, fd=>{
    const g = k => (fd.get(k)??'').toString().trim();
    if(stage==='rejected' && !g('reason')) return 'Choose a rejection reason.';
    if(stage==='notnow' && (!g('reason')||!g('date'))) return 'Add a reason and a re-contact date.';
    if(['meeting','proposal','converted'].includes(stage) && !g('date')) return 'Pick a date.';
    if(stage==='converted' && !g('value')) return 'Add the final value.';
    applyStage(id, stage, {am:g('am'), date:g('date'), time:g('time'), notes:g('notes'), value:g('value'), chase:g('chase'), reason:g('reason'), services:fd.getAll('services').map(String)});
  });
}
function applyStage(id, stage, x){
  const l = clone(S.leads[id]), from = ST[l.status].l, now = new Date().toISOString();
  l.status = stage; l.stageHistory = [...(l.stageHistory||[]), {s:stage, at:now}];
  let extra = '';
  if(stage==='meeting'){ l.meetingDate = x.date; l.next = {type:'Meeting', text:`Discovery meeting${x.time?' at '+x.time:''}${x.notes?' ('+x.notes+')':''}`, due:x.date, reminder:'1 hour before'}; extra = ` Meeting on ${fmtD(x.date)}.`; }
  if(stage==='proposal'){ l.proposalDate = x.date; if(x.value) l.value = +x.value; l.next = {type:'Follow-up', text:'Chase proposal feedback', due:x.chase||addDays(x.date,3), reminder:'Morning of'}; extra = ` Proposal dated ${fmtD(x.date)}.`; }
  if(stage==='converted'){ if(x.am) l.accountManagerId = x.am; l.conversion = {date:x.date, value:+x.value, services:x.services}; l.value = +x.value; l.probability = 100; if(x.services?.length) l.services = x.services; l.next = null; extra = ` ${money(x.value)}/month.${x.am?' Account manager: '+pname(x.am)+'.':''}`; }
  if(stage==='rejected'){ l.rejection = {reason:x.reason, notes:x.notes, date:today()}; l.next = null; extra = ` Reason: ${x.reason}.${x.notes?' '+x.notes:''}`; }
  if(stage==='notnow'){ l.notNow = {reason:x.reason, recontact:x.date, date:today()}; l.next = {type:'Re-contact', text:`Re-contact ${contact(l).name||l.company}`, due:x.date, reminder:'Morning of'}; extra = ` ${x.reason}. Re-contact ${fmtD(x.date)}.`; }
  if(stage==='unresponsive') l.next = null;
  l.activities = [...(l.activities||[]), {id:uid('a'), at:now, by:actor(), type:'Status Change', text:`Moved from ${from} to ${ST[stage].l}.${extra}`}];
  saveLead(l, `Lead moved to ${ST[stage].l}.`);
  if(needsNext(l) && (!l.next || !l.next.due)) setTimeout(()=>toast('Set the next action for this lead.','',{a:'editnext',id:l.id,label:'Schedule'}),300);
}

function parseCSV(text){
  const rows = []; let row = [], cur = '', q = false;
  for(let i=0;i<text.length;i++){ const ch = text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q = false; } else cur += ch; }
    else if(ch==='"') q = true; else if(ch===','){ row.push(cur); cur=''; } else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; } else if(ch!=='\r') cur += ch; }
  if(cur!=='' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
